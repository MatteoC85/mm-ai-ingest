name: Phase 6 isolated native validation
on:
  push:
    branches: [phase6-native-validation-20261001]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase6-native-validation
  cancel-in-progress: false
jobs:
  postgres-and-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: mm_gate
          POSTGRES_PASSWORD: isolated_validation_password_not_a_secret_20261001
          POSTGRES_DB: p6_validation
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U mm_gate -d p6_validation'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout isolated harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact public source baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3608ee56b2eb292c35c34558e5ae998425a26504
          path: app
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reconstruct and verify candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,json
          root=Path('harness'); out=root/'unpacked';out.mkdir()
          text=''.join((root/'bundle'/f'part{i}.b64').read_text() for i in range(1,5))
          raw=base64.b64decode(text,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='b0acea26dfd147f7a57f648f49627cf21e34621e85e93cdfafd955ded8c9b06c'
          for name,content in json.loads(lzma.decompress(raw)).items():
            p=out/name
            assert not Path(name).is_absolute() and '..' not in Path(name).parts
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content,encoding='utf-8')
          PY
          python harness/unpacked/prepare.py app
      - name: Install actual application dependencies
        run: python -m pip install -r app/requirements.txt httpx
      - name: Contracts, ASGI, cache checkpoint and real SQL concurrency tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app:${{ github.workspace }}/harness/unpacked/tests
          MM_CANDIDATE_PATH: ${{ github.workspace }}/app
          P6_NATIVE_TEST_DSN: postgresql://mm_gate:isolated_validation_password_not_a_secret_20261001@127.0.0.1:5432/p6_validation
        run: python -m unittest discover -s harness/unpacked/tests -p 'test_*.py' -v
      - name: Actual FastAPI app, database health and unauthorized dispatch
        env:
          PYTHONPATH: ${{ github.workspace }}/app:${{ github.workspace }}/harness/unpacked/tests
          MM_CANDIDATE_PATH: ${{ github.workspace }}/app
          P6_NATIVE_TEST_DSN: postgresql://mm_gate:isolated_validation_password_not_a_secret_20261001@127.0.0.1:5432/p6_validation
        run: python harness/unpacked/tests/probe_actual_app.py
