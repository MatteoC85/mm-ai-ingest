serviceAccount: projects/machinemind-ai-2a/serviceAccounts/443517556116-compute@developer.gserviceaccount.com
logsBucket: gs://mm-ai-cb-logs-443517556116
substitutions:
  _REGION: europe-west1
  _SERVICE: mm-ai-ingest-fixed
  _AR_REPOSITORY: mm-ai-ingest
  _IMAGE_NAME: mm-ai-ingest
  _EXPECTED_CODE_MARKER: phase2-vision-v2.7-source-snapshot
  _EXPECTED_STRUCTURED_MODEL: gpt-5.4
  _EXPECTED_DETECTOR_PROMPT: mm-electrical-region-detector-v2
  _EXPECTED_EXTRACTOR_PROMPT: mm-electrical-table-extractor-v2.2
  _EXPECTED_VERIFIER_PROMPT: mm-electrical-page-verifier-v2.7
  _EXPECTED_MATERIALIZER_VERSION: mm-electrical-structured-materializer-v2.7
  _EXPECTED_TERMINAL_MARKER: phase2-terminals-v1.2.1-source-snapshot
  _EXPECTED_TERMINAL_MODEL: gpt-5.4
  _EXPECTED_TERMINAL_DETECTOR_PROMPT: mm-electrical-terminal-detector-v1
  _EXPECTED_TERMINAL_EXTRACTOR_PROMPT: mm-electrical-terminal-strip-extractor-v1
  _EXPECTED_TERMINAL_VERIFIER_PROMPT: mm-electrical-terminal-page-verifier-v1.2
  _EXPECTED_TERMINAL_MATERIALIZER: mm-electrical-terminal-materializer-v1.2.1
