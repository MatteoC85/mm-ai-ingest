serviceAccount: projects/machinemind-ai-2a/serviceAccounts/443517556116-compute@developer.gserviceaccount.com
logsBucket: gs://mm-ai-cb-logs-443517556116
substitutions:
  _REGION: europe-west1
  _SERVICE: mm-ai-ingest-fixed
  _AR_REPOSITORY: mm-ai-ingest
  _IMAGE_NAME: mm-ai-ingest
  _EXPECTED_CODE_MARKER: phase2-vision-v2.7-source-snapshot
  _EXPECTED_STRUCTURED_MODEL: gpt-5.4
  _EXPECTED_DETECTOR_PROMPT: mm-electrical-region-detector-v2
  _EXPECTED_EXTRACTOR_PROMPT: mm-electrical-table-extractor-v2.2
  _EXPECTED_VERIFIER_PROMPT: mm-electrical-page-verifier-v2.7
  _EXPECTED_MATERIALIZER_VERSION: mm-electrical-structured-materializer-v2.7
  _EXPECTED_TERMINAL_MARKER: phase2-terminals-v1.2-source-snapshot
  _EXPECTED_TERMINAL_MODEL: gpt-5.4
  _EXPECTED_TERMINAL_DETECTOR_PROMPT: mm-electrical-terminal-detector-v1
  _EXPECTED_TERMINAL_EXTRACTOR_PROMPT: mm-electrical-terminal-strip-extractor-v1
  _EXPECTED_TERMINAL_VERIFIER_PROMPT: mm-electrical-terminal-page-verifier-v1.2
  _EXPECTED_TERMINAL_MATERIALIZER: mm-electrical-terminal-materializer-v1.2
steps:
- id: 01-source-preflight
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  args:
  - -c
  - "set -euo pipefail\n\nfor file in \\\n  Dockerfile \\\n  main.py \\\n  electrical_semantic.py \\\n  electrical_structured.py \\\n  electrical_terminals.py \\\n  electrical_source_store.py \\\n  cloudbuild_runtime_preflight.py \\\n  cloudbuild_runtime_preflight.py \\\n  requirements.txt\ndo\n  test -f \"$${file}\" || {\n    echo \"FILE OBBLIGATORIO MANCANTE: $${file}\"\n    exit 1\n  }\ndone\n\npython3 -m py_compile \\\n  main.py \\\n  electrical_semantic.py \\\n  electrical_structured.py \\\n  electrical_terminals.py \\\n  electrical_source_store.py \\\n  cloudbuild_runtime_preflight.py\n\necho \"SOURCE PREFLIGHT: OK\"\n"
- id: 02-build-image
  name: gcr.io/cloud-builders/docker
  args:
  - build
  - -t
  - europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
  - -f
  - Dockerfile
  - .
- id: 03-runtime-test-image
  name: gcr.io/cloud-builders/docker
  entrypoint: bash
  args:
  - -c
  - "set -euo pipefail\n\nIMAGE=\"europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA\"\nBUILD8=\"$$(printf '%s' '$BUILD_ID' | cut -c1-8)\"\nNAME=\"mm-preflight-$SHORT_SHA-$${BUILD8}\"\n\ncleanup() {\n  docker rm -f \"$${NAME}\" >/dev/null 2>&1 || true\n}\ntrap cleanup EXIT\n\ndocker run -d \\\n  --name \"$${NAME}\" \\\n  -e PORT=8080 \\\n  -e MM_ELECTRICAL_SOURCE_SNAPSHOT_ENABLED=1 \\\n  -e MM_ELECTRICAL_SOURCE_BUCKET=mm-ai-electrical-sources-443517556116 \\\n  -e MM_ELECTRICAL_TERMINALS_ENABLED=1 \\\n  -e MM_ELECTRICAL_TERMINALS_DETECTOR_MODEL=${_EXPECTED_TERMINAL_MODEL} \\\n  -e MM_ELECTRICAL_TERMINALS_EXTRACTOR_MODEL=${_EXPECTED_TERMINAL_MODEL} \\\n  -e MM_ELECTRICAL_TERMINALS_VERIFIER_MODEL=${_EXPECTED_TERMINAL_MODEL} \\\n  -e MM_ELECTRICAL_TERMINALS_DETECTOR_PROMPT_VERSION=${_EXPECTED_TERMINAL_DETECTOR_PROMPT} \\\n  -e MM_ELECTRICAL_TERMINALS_EXTRACTOR_PROMPT_VERSION=${_EXPECTED_TERMINAL_EXTRACTOR_PROMPT} \\\n  -e MM_ELECTRICAL_TERMINALS_VERIFIER_PROMPT_VERSION=${_EXPECTED_TERMINAL_VERIFIER_PROMPT}\
    \ \\\n  -e MM_ELECTRICAL_TERMINALS_MATERIALIZER_VERSION=${_EXPECTED_TERMINAL_MATERIALIZER} \\\n  -e EXPECTED_CODE_MARKER=${_EXPECTED_CODE_MARKER} \\\n  -e EXPECTED_STRUCTURED_MODEL=${_EXPECTED_STRUCTURED_MODEL} \\\n  -e EXPECTED_DETECTOR_PROMPT=${_EXPECTED_DETECTOR_PROMPT} \\\n  -e EXPECTED_EXTRACTOR_PROMPT=${_EXPECTED_EXTRACTOR_PROMPT} \\\n  -e EXPECTED_VERIFIER_PROMPT=${_EXPECTED_VERIFIER_PROMPT} \\\n  -e EXPECTED_MATERIALIZER_VERSION=${_EXPECTED_MATERIALIZER_VERSION} \\\n  -e EXPECTED_TERMINAL_MARKER=${_EXPECTED_TERMINAL_MARKER} \\\n  -e EXPECTED_TERMINAL_MODEL=${_EXPECTED_TERMINAL_MODEL} \\\n  -e EXPECTED_TERMINAL_DETECTOR_PROMPT=${_EXPECTED_TERMINAL_DETECTOR_PROMPT} \\\n  -e EXPECTED_TERMINAL_EXTRACTOR_PROMPT=${_EXPECTED_TERMINAL_EXTRACTOR_PROMPT} \\\n  -e EXPECTED_TERMINAL_VERIFIER_PROMPT=${_EXPECTED_TERMINAL_VERIFIER_PROMPT} \\\n  -e EXPECTED_TERMINAL_MATERIALIZER=${_EXPECTED_TERMINAL_MATERIALIZER} \\\n  \"$${IMAGE}\" >/dev/null\n\nREADY=0\nfor _ in $$(seq 1 45); do\n  if docker\
    \ exec \"$${NAME}\" python -c \\\n    \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=3).read()\" \\\n    >/dev/null 2>&1\n  then\n    READY=1\n    break\n  fi\n  sleep 1\ndone\n\nif [ \"$${READY}\" != \"1\" ]; then\n  echo \"IL CONTAINER NON SI È AVVIATO SULLA PORTA 8080\"\n  docker logs \"$${NAME}\" || true\n  exit 1\nfi\n\ndocker cp \\\n  /workspace/cloudbuild_runtime_preflight.py \\\n  \"$${NAME}:/tmp/cloudbuild_runtime_preflight.py\"\n\ndocker exec \"$${NAME}\" sh -c \\\n  'PYTHONPATH=\"$(pwd):${PYTHONPATH:-}\" python /tmp/cloudbuild_runtime_preflight.py'"
- id: 04-push-image
  name: gcr.io/cloud-builders/docker
  args:
  - push
  - europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
- id: 05-deploy-candidate-zero-traffic
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  args:
  - -c
  - "set -Eeuo pipefail\n\nIMAGE=\"europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA\"\nBUILD8=\"$$(printf '%s' '$BUILD_ID' | cut -c1-8)\"\nREV_SUFFIX=\"$SHORT_SHA-$${BUILD8}\"\nREVISION=\"${_SERVICE}-$${REV_SUFFIX}\"\nTAG=\"candidate-$SHORT_SHA-$${BUILD8}\"\n\ncleanup_failed_candidate() {\n  gcloud run services update-traffic \"${_SERVICE}\" \\\n    --region=\"${_REGION}\" \\\n    --remove-tags=\"$${TAG}\" \\\n    --quiet \\\n    >/dev/null 2>&1 || true\n}\ntrap cleanup_failed_candidate ERR\n\ngcloud run services describe \"${_SERVICE}\" \\\n  --region=\"${_REGION}\" \\\n  --format=json \\\n  > /workspace/service-before.json\n\npython3 - <<'PY' > /workspace/previous_revision.txt\nimport json\n\nwith open('/workspace/service-before.json', encoding='utf-8') as f:\n    service = json.load(f)\n\nrevisions = [\n    row.get('revisionName')\n    for row in service.get('status', {}).get('traffic', [])\n    if int(row.get('percent') or 0) == 100\n    and row.get('revisionName')\n\
    ]\n\nif len(revisions) != 1:\n    raise SystemExit(\n        'ATTESO UN SOLO PRECEDENTE AL 100%, TROVATI: '\n        + repr(revisions)\n    )\n\nprint(revisions[0])\nPY\n\nPREVIOUS_REVISION=\"$$(cat /workspace/previous_revision.txt)\"\n\necho \"REVISIONE SANA PRECEDENTE: $${PREVIOUS_REVISION}\"\necho \"NUOVA REVISIONE CANDIDATA: $${REVISION}\"\necho \"TAG CANDIDATA: $${TAG}\"\n\ngcloud run deploy \"${_SERVICE}\" \\\n  --image=\"$${IMAGE}\" \\\n  --region=\"${_REGION}\" \\\n  --platform=managed \\\n  --allow-unauthenticated \\\n  --no-traffic \\\n  --tag=\"$${TAG}\" \\\n  --revision-suffix=\"$${REV_SUFFIX}\" \\\n  --timeout=\"600s\" \\\n  --remove-env-vars=\"MM_ELECTRICAL_STRUCTURED_MODEL,MM_ELECTRICAL_STRUCTURED_PROMPT_VERSION,MM_ELECTRICAL_STRUCTURED_MIN_CONFIDENCE,MM_ELECTRICAL_STRUCTURED_MAX_WORDS_PER_PAGE\" \\\n  --update-env-vars=\"COMMIT_SHA=$COMMIT_SHA,MM_ELECTRICAL_STRUCTURED_ENABLED=1,MM_ELECTRICAL_STRUCTURED_DETECTOR_MODEL=gpt-5.4,MM_ELECTRICAL_STRUCTURED_EXTRACTOR_MODEL=gpt-5.4,MM_ELECTRICAL_STRUCTURED_VERIFIER_MODEL=gpt-5.4,MM_ELECTRICAL_STRUCTURED_DETECTOR_PROMPT_VERSION=mm-electrical-region-detector-v2,MM_ELECTRICAL_STRUCTURED_EXTRACTOR_PROMPT_VERSION=mm-electrical-table-extractor-v2.2,MM_ELECTRICAL_STRUCTURED_VERIFIER_PROMPT_VERSION=mm-electrical-page-verifier-v2.7,MM_ELECTRICAL_STRUCTURED_MATERIALIZER_VERSION=mm-electrical-structured-materializer-v2.7,MM_ELECTRICAL_STRUCTURED_ROW_MIN_CONFIDENCE=0.80,MM_ELECTRICAL_STRUCTURED_PAGE_PASS_MIN_CONFIDENCE=0.90,MM_ELECTRICAL_STRUCTURED_TEXT_RECONSTRUCTION_MIN_CONFIDENCE=0.90,MM_ELECTRICAL_STRUCTURED_RENDER_DPI=220,MM_ELECTRICAL_STRUCTURED_MAX_COMPLETION_TOKENS=16000,MM_ELECTRICAL_STRUCTURED_FETCH_TIMEOUT_SECONDS=60,MM_ELECTRICAL_STRUCTURED_TIMEOUT_SECONDS=240,MM_ELECTRICAL_STRUCTURED_MAX_SOURCE_BYTES=100000000,MM_ELECTRICAL_STRUCTURED_INPUT_USD_PER_MILLION=0,MM_ELECTRICAL_STRUCTURED_OUTPUT_USD_PER_MILLION=0,MM_ELECTRICAL_TERMINALS_ENABLED=1,MM_ELECTRICAL_TERMINALS_DETECTOR_MODEL=gpt-5.4,MM_ELECTRICAL_TERMINALS_EXTRACTOR_MODEL=gpt-5.4,MM_ELECTRICAL_TERMINALS_VERIFIER_MODEL=gpt-5.4,MM_ELECTRICAL_TERMINALS_DETECTOR_PROMPT_VERSION=mm-electrical-terminal-detector-v1,MM_ELECTRICAL_TERMINALS_EXTRACTOR_PROMPT_VERSION=mm-electrical-terminal-strip-extractor-v1,MM_ELECTRICAL_TERMINALS_VERIFIER_PROMPT_VERSION=mm-electrical-terminal-page-verifier-v1.2,MM_ELECTRICAL_TERMINALS_MATERIALIZER_VERSION=mm-electrical-terminal-materializer-v1.2,MM_ELECTRICAL_TERMINALS_ROW_MIN_CONFIDENCE=0.82,MM_ELECTRICAL_TERMINALS_PAGE_PASS_MIN_CONFIDENCE=0.90,MM_ELECTRICAL_TERMINALS_RENDER_DPI=220,MM_ELECTRICAL_TERMINALS_MAX_COMPLETION_TOKENS=16000,MM_ELECTRICAL_TERMINALS_FETCH_TIMEOUT_SECONDS=60,MM_ELECTRICAL_TERMINALS_TIMEOUT_SECONDS=240,MM_ELECTRICAL_TERMINALS_MAX_SOURCE_BYTES=100000000,MM_ELECTRICAL_TERMINALS_INPUT_USD_PER_MILLION=0,MM_ELECTRICAL_TERMINALS_OUTPUT_USD_PER_MILLION=0,MM_ELECTRICAL_SOURCE_SNAPSHOT_ENABLED=1,MM_ELECTRICAL_SOURCE_BUCKET=mm-ai-electrical-sources-443517556116,MM_ELECTRICAL_SOURCE_PREFIX=electrical-source-v1,MM_ELECTRICAL_SOURCE_TIMEOUT_SECONDS=90,MM_ELECTRICAL_SOURCE_MAX_BYTES=100000000\"\
    \ \\\n  --quiet\n\ngcloud run services describe \"${_SERVICE}\" \\\n  --region=\"${_REGION}\" \\\n  --format=json \\\n  > /workspace/service-candidate.json\n\nexport TAG REVISION\npython3 - <<'PY' > /workspace/candidate_url.txt\nimport json\nimport os\n\ntag = os.environ['TAG']\nrevision = os.environ['REVISION']\n\nwith open('/workspace/service-candidate.json', encoding='utf-8') as f:\n    service = json.load(f)\n\nmatches = [\n    row\n    for row in service.get('status', {}).get('traffic', [])\n    if row.get('tag') == tag\n    and row.get('revisionName') == revision\n]\n\nif len(matches) != 1 or not matches[0].get('url'):\n    raise SystemExit(\n        'URL TAGGATA NON TROVATA PER '\n        + tag\n        + ' / '\n        + revision\n    )\n\nprint(matches[0]['url'].rstrip('/'))\nPY\n\nCANDIDATE_URL=\"$$(cat /workspace/candidate_url.txt)\"\n\nprintf \\\n  'PREVIOUS_REVISION=%s\\nREVISION=%s\\nTAG=%s\\nCANDIDATE_URL=%s\\n' \\\n  \"$${PREVIOUS_REVISION}\" \\\n  \"$${REVISION}\" \\\
    \n  \"$${TAG}\" \\\n  \"$${CANDIDATE_URL}\" \\\n  > /workspace/deploy.env\n\necho \"CANDIDATE URL: $${CANDIDATE_URL}\"\ntrap - ERR\n"
- id: 06-smoke-test-candidate
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  args:
  - -c
  - "set -Eeuo pipefail\nsource /workspace/deploy.env\n\ncleanup_failed_candidate() {\n  gcloud run services update-traffic \"${_SERVICE}\" \\\n    --region=\"${_REGION}\" \\\n    --remove-tags=\"$${TAG}\" \\\n    --quiet \\\n    >/dev/null 2>&1 || true\n}\ntrap cleanup_failed_candidate ERR\n\nCANDIDATE_URL=\"$${CANDIDATE_URL}\" \\\nEXPECTED_REVISION=\"$${REVISION}\" \\\nEXPECTED_COMMIT=\"$COMMIT_SHA\" \\\nEXPECTED_MARKER=\"${_EXPECTED_CODE_MARKER}\" \\\nEXPECTED_STRUCTURED_MODEL=\"${_EXPECTED_STRUCTURED_MODEL}\" \\\nEXPECTED_DETECTOR_PROMPT=\"${_EXPECTED_DETECTOR_PROMPT}\" \\\nEXPECTED_EXTRACTOR_PROMPT=\"${_EXPECTED_EXTRACTOR_PROMPT}\" \\\nEXPECTED_VERIFIER_PROMPT=\"${_EXPECTED_VERIFIER_PROMPT}\" \\\nEXPECTED_MATERIALIZER_VERSION=\"${_EXPECTED_MATERIALIZER_VERSION}\" \\\nEXPECTED_TERMINAL_MARKER=\"${_EXPECTED_TERMINAL_MARKER}\" \\\nEXPECTED_TERMINAL_MODEL=\"${_EXPECTED_TERMINAL_MODEL}\" \\\nEXPECTED_TERMINAL_DETECTOR_PROMPT=\"${_EXPECTED_TERMINAL_DETECTOR_PROMPT}\" \\\nEXPECTED_TERMINAL_EXTRACTOR_PROMPT=\"\
    ${_EXPECTED_TERMINAL_EXTRACTOR_PROMPT}\" \\\nEXPECTED_TERMINAL_VERIFIER_PROMPT=\"${_EXPECTED_TERMINAL_VERIFIER_PROMPT}\" \\\nEXPECTED_TERMINAL_MATERIALIZER=\"${_EXPECTED_TERMINAL_MATERIALIZER}\" \\\npython3 - <<'PY'\nimport json\nimport os\nimport time\nimport urllib.request\n\nbase = os.environ['CANDIDATE_URL'].rstrip('/')\n\ndef get_json(path):\n    last_error = None\n    for _ in range(30):\n        try:\n            with urllib.request.urlopen(\n                base + path,\n                timeout=10,\n            ) as response:\n                return json.load(response)\n        except Exception as exc:\n            last_error = exc\n            time.sleep(2)\n    raise RuntimeError(\n        f'SMOKE TEST FALLITO SU {path}: {last_error}'\n    )\n\nping = get_json('/ping')\nversion = get_json('/version')\nopenapi = get_json('/openapi.json')\n\nassert ping.get('ok') is True, ping\nassert version.get('ok') is True, version\nassert (\n    version.get('revision')\n    == os.environ['EXPECTED_REVISION']\n\
    ), version\nassert (\n    version.get('commit_sha')\n    == os.environ['EXPECTED_COMMIT']\n), version\nassert (\n    version.get('electrical_code_marker')\n    == os.environ['EXPECTED_MARKER']\n), version\nassert version.get('electrical_source_snapshot_enabled') is True, version\nassert (\n    version.get('electrical_source_snapshot_bucket')\n    == 'mm-ai-electrical-sources-443517556116'\n), version\nassert version.get('electrical_structured_enabled') is True, version\nassert (\n    version.get('electrical_structured_pipeline_marker')\n    == os.environ['EXPECTED_MARKER']\n), version\nassert (\n    version.get('electrical_structured_detector_model')\n    == os.environ['EXPECTED_STRUCTURED_MODEL']\n), version\nassert (\n    version.get('electrical_structured_extractor_model')\n    == os.environ['EXPECTED_STRUCTURED_MODEL']\n), version\nassert (\n    version.get('electrical_structured_verifier_model')\n    == os.environ['EXPECTED_STRUCTURED_MODEL']\n), version\nassert (\n    version.get('electrical_structured_detector_prompt_version')\n\
    \    == os.environ['EXPECTED_DETECTOR_PROMPT']\n), version\nassert (\n    version.get('electrical_structured_extractor_prompt_version')\n    == os.environ['EXPECTED_EXTRACTOR_PROMPT']\n), version\nassert (\n    version.get('electrical_structured_verifier_prompt_version')\n    == os.environ['EXPECTED_VERIFIER_PROMPT']\n), version\nassert (\n    version.get('electrical_structured_materializer_version')\n    == os.environ['EXPECTED_MATERIALIZER_VERSION']\n), version\nassert version.get('electrical_terminals_enabled') is True, version\nassert (\n    version.get('electrical_terminals_pipeline_marker')\n    == os.environ['EXPECTED_TERMINAL_MARKER']\n), version\nassert (\n    version.get('electrical_terminals_detector_model')\n    == os.environ['EXPECTED_TERMINAL_MODEL']\n), version\nassert (\n    version.get('electrical_terminals_extractor_model')\n    == os.environ['EXPECTED_TERMINAL_MODEL']\n), version\nassert (\n    version.get('electrical_terminals_verifier_model')\n    == os.environ['EXPECTED_TERMINAL_MODEL']\n\
    ), version\nassert (\n    version.get('electrical_terminals_detector_prompt_version')\n    == os.environ['EXPECTED_TERMINAL_DETECTOR_PROMPT']\n), version\nassert (\n    version.get('electrical_terminals_extractor_prompt_version')\n    == os.environ['EXPECTED_TERMINAL_EXTRACTOR_PROMPT']\n), version\nassert (\n    version.get('electrical_terminals_verifier_prompt_version')\n    == os.environ['EXPECTED_TERMINAL_VERIFIER_PROMPT']\n), version\nassert (\n    version.get('electrical_terminals_materializer_version')\n    == os.environ['EXPECTED_TERMINAL_MATERIALIZER']\n), version\n\nrequired = {\n    '/v1/ai/electrical/normalize',\n    '/v1/ai/electrical/extract-structured',\n    '/v1/ai/electrical/extract-terminals',\n    '/v1/ai/electrical/source/snapshot',\n}\nmissing = required - set(openapi.get('paths', {}))\nassert not missing, f'ROUTE MANCANTI: {sorted(missing)}'\n\nprint('CANDIDATE SMOKE TEST: OK')\nprint(json.dumps({\n    'revision': version.get('revision'),\n    'commit_sha': version.get('commit_sha'),\n\
    \    'marker': version.get('electrical_code_marker'),\n    'routes': sorted(required),\n}, ensure_ascii=False))\nPY\n\ntrap - ERR\n"
- id: 07-promote-tested-revision
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  args:
  - -c
  - "set -euo pipefail\nsource /workspace/deploy.env\n\nrollback() {\n  echo \"POST-PROMOTION SMOKE FALLITO: ROLLBACK A $${PREVIOUS_REVISION}\"\n\n  gcloud run services update-traffic \"${_SERVICE}\" \\\n    --region=\"${_REGION}\" \\\n    --to-revisions=\"$${PREVIOUS_REVISION}=100\" \\\n    --quiet || true\n\n  gcloud run services update-traffic \"${_SERVICE}\" \\\n    --region=\"${_REGION}\" \\\n    --remove-tags=\"$${TAG}\" \\\n    --quiet \\\n    >/dev/null 2>&1 || true\n}\n\ngcloud run services update-traffic \"${_SERVICE}\" \\\n  --region=\"${_REGION}\" \\\n  --to-revisions=\"$${REVISION}=100\" \\\n  --quiet\n\ngcloud run services describe \"${_SERVICE}\" \\\n  --region=\"${_REGION}\" \\\n  --format=json \\\n  > /workspace/service-promoted.json\n\nSERVICE_URL=\"$$(python3 - <<'PY'\nimport json\n\nwith open('/workspace/service-promoted.json', encoding='utf-8') as f:\n    service = json.load(f)\n\nprint(\n    str(service.get('status', {}).get('url') or '').rstrip('/')\n)\nPY\n)\"\n\n\
    if ! \\\n  SERVICE_URL=\"$${SERVICE_URL}\" \\\n  EXPECTED_REVISION=\"$${REVISION}\" \\\n  EXPECTED_COMMIT=\"$COMMIT_SHA\" \\\n  EXPECTED_MARKER=\"${_EXPECTED_CODE_MARKER}\" \\\n  EXPECTED_STRUCTURED_MODEL=\"${_EXPECTED_STRUCTURED_MODEL}\" \\\n  EXPECTED_DETECTOR_PROMPT=\"${_EXPECTED_DETECTOR_PROMPT}\" \\\n  EXPECTED_EXTRACTOR_PROMPT=\"${_EXPECTED_EXTRACTOR_PROMPT}\" \\\n  EXPECTED_VERIFIER_PROMPT=\"${_EXPECTED_VERIFIER_PROMPT}\" \\\n  EXPECTED_MATERIALIZER_VERSION=\"${_EXPECTED_MATERIALIZER_VERSION}\" \\\n  EXPECTED_TERMINAL_MARKER=\"${_EXPECTED_TERMINAL_MARKER}\" \\\n  EXPECTED_TERMINAL_MODEL=\"${_EXPECTED_TERMINAL_MODEL}\" \\\n  EXPECTED_TERMINAL_DETECTOR_PROMPT=\"${_EXPECTED_TERMINAL_DETECTOR_PROMPT}\" \\\n  EXPECTED_TERMINAL_EXTRACTOR_PROMPT=\"${_EXPECTED_TERMINAL_EXTRACTOR_PROMPT}\" \\\n  EXPECTED_TERMINAL_VERIFIER_PROMPT=\"${_EXPECTED_TERMINAL_VERIFIER_PROMPT}\" \\\n  EXPECTED_TERMINAL_MATERIALIZER=\"${_EXPECTED_TERMINAL_MATERIALIZER}\" \\\n  python3 - <<'PY'\nimport json\nimport\
    \ os\nimport time\nimport urllib.request\n\nwith open('/workspace/service-promoted.json', encoding='utf-8') as f:\n    service = json.load(f)\n\nexpected_revision = os.environ['EXPECTED_REVISION']\ntraffic = service.get('status', {}).get('traffic', [])\nmatching = [\n    row\n    for row in traffic\n    if row.get('revisionName') == expected_revision\n    and int(row.get('percent') or 0) == 100\n]\nassert len(matching) == 1, traffic\n\nbase = os.environ['SERVICE_URL'].rstrip('/')\n\ndef get_version():\n    last_error = None\n    for _ in range(30):\n        try:\n            with urllib.request.urlopen(\n                base + '/version',\n                timeout=10,\n            ) as response:\n                return json.load(response)\n        except Exception as exc:\n            last_error = exc\n            time.sleep(2)\n    raise RuntimeError(\n        f'POST-PROMOTION SMOKE FALLITO: {last_error}'\n    )\n\nversion = get_version()\n\nassert version.get('ok') is True, version\n\
    assert version.get('revision') == expected_revision, version\nassert (\n    version.get('commit_sha')\n    == os.environ['EXPECTED_COMMIT']\n), version\nassert (\n    version.get('electrical_code_marker')\n    == os.environ['EXPECTED_MARKER']\n), version\nassert version.get('electrical_source_snapshot_enabled') is True, version\nassert (\n    version.get('electrical_source_snapshot_bucket')\n    == 'mm-ai-electrical-sources-443517556116'\n), version\nassert version.get('electrical_structured_enabled') is True, version\nassert (\n    version.get('electrical_structured_pipeline_marker')\n    == os.environ['EXPECTED_MARKER']\n), version\nassert (\n    version.get('electrical_structured_detector_model')\n    == os.environ['EXPECTED_STRUCTURED_MODEL']\n), version\nassert (\n    version.get('electrical_structured_extractor_model')\n    == os.environ['EXPECTED_STRUCTURED_MODEL']\n), version\nassert (\n    version.get('electrical_structured_verifier_model')\n    == os.environ['EXPECTED_STRUCTURED_MODEL']\n\
