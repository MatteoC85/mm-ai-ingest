  _EXPECTED_BOM_MODEL: gpt-5.4
  _EXPECTED_BOM_DETECTOR_PROMPT: mm-electrical-bom-detector-v1
  _EXPECTED_BOM_EXTRACTOR_PROMPT: mm-electrical-bom-table-extractor-v1.1
  _EXPECTED_BOM_VERIFIER_PROMPT: mm-electrical-bom-page-verifier-v1.1
  _EXPECTED_BOM_MATERIALIZER: mm-electrical-bom-materializer-v2.1
