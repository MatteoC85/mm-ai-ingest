serviceAccount: projects/machinemind-ai-2a/serviceAccounts/443517556116-compute@developer.gserviceaccount.com
logsBucket: gs://mm-ai-cb-logs-443517556116

substitutions:
  _REGION: "europe-west1"
  _SERVICE: "mm-ai-ingest-fixed"
  _AR_REPOSITORY: "mm-ai-ingest"
  _IMAGE_NAME: "mm-ai-ingest"
  _EXPECTED_CODE_MARKER: "phase2-vision-v2.2-source-snapshot"
  _EXPECTED_STRUCTURED_MODEL: "gpt-5.4"
  _EXPECTED_DETECTOR_PROMPT: "mm-electrical-region-detector-v2"
  _EXPECTED_EXTRACTOR_PROMPT: "mm-electrical-table-extractor-v2.2"
  _EXPECTED_VERIFIER_PROMPT: "mm-electrical-page-verifier-v2.2"
  _EXPECTED_MATERIALIZER_VERSION: "mm-electrical-structured-materializer-v2.2"

steps:
  - id: "01-source-preflight"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail

        for file in \
          Dockerfile \
          main.py \
          electrical_semantic.py \
          electrical_structured.py \
          electrical_source_store.py \
          requirements.txt
        do
          test -f "$${file}" || {
            echo "FILE OBBLIGATORIO MANCANTE: $${file}"
            exit 1
          }
        done

        python3 -m py_compile \
          main.py \
          electrical_semantic.py \
          electrical_structured.py \
          electrical_source_store.py

        echo "SOURCE PREFLIGHT: OK"

  - id: "02-build-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA"
      - "-f"
      - "Dockerfile"
      - "."

  - id: "03-runtime-test-image"
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail

        IMAGE="europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA"
        BUILD8="$$(printf '%s' '$BUILD_ID' | cut -c1-8)"
        NAME="mm-preflight-$SHORT_SHA-$${BUILD8}"

        cleanup() {
          docker rm -f "$${NAME}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        docker run -d \
          --name "$${NAME}" \
          -e PORT=8080 \
          -e MM_ELECTRICAL_SOURCE_SNAPSHOT_ENABLED=1 \
          -e MM_ELECTRICAL_SOURCE_BUCKET=mm-ai-electrical-sources-443517556116 \
          "$${IMAGE}" >/dev/null

        READY=0
        for _ in $$(seq 1 45); do
          if docker exec "$${NAME}" python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=3).read()" \
            >/dev/null 2>&1
          then
            READY=1
            break
          fi
          sleep 1
        done

        if [ "$${READY}" != "1" ]; then
          echo "IL CONTAINER NON SI È AVVIATO SULLA PORTA 8080"
          docker logs "$${NAME}" || true
          exit 1
        fi

        docker exec "$${NAME}" python -c "
        import json
        import urllib.request

        def get(path):
            with urllib.request.urlopen(
                'http://127.0.0.1:8080' + path,
                timeout=10,
            ) as response:
                return json.load(response)

        ping = get('/ping')
        version = get('/version')
        openapi = get('/openapi.json')

        assert ping.get('ok') is True, ping
        assert version.get('ok') is True, version
        assert (
            version.get('electrical_code_marker')
            == '${_EXPECTED_CODE_MARKER}'
        ), version
        assert (
            version.get('electrical_structured_pipeline_marker')
            == '${_EXPECTED_CODE_MARKER}'
        ), version
        assert version.get('electrical_structured_detector_model') == '${_EXPECTED_STRUCTURED_MODEL}', version
        assert version.get('electrical_structured_extractor_model') == '${_EXPECTED_STRUCTURED_MODEL}', version
        assert version.get('electrical_structured_verifier_model') == '${_EXPECTED_STRUCTURED_MODEL}', version
        assert (
            version.get('electrical_structured_detector_prompt_version')
            == '${_EXPECTED_DETECTOR_PROMPT}'
        ), version
        assert (
            version.get('electrical_structured_extractor_prompt_version')
            == '${_EXPECTED_EXTRACTOR_PROMPT}'
        ), version
        assert (
            version.get('electrical_structured_verifier_prompt_version')
            == '${_EXPECTED_VERIFIER_PROMPT}'
        ), version
        assert (
            version.get('electrical_structured_materializer_version')
            == '${_EXPECTED_MATERIALIZER_VERSION}'
        ), version

        assert version.get('electrical_source_snapshot_enabled') is True, version
        assert (
            version.get('electrical_source_snapshot_bucket')
            == 'mm-ai-electrical-sources-443517556116'
        ), version

        required = {
            '/v1/ai/electrical/normalize',
            '/v1/ai/electrical/extract-structured',
            '/v1/ai/electrical/source/snapshot',
        }
        missing = required - set(openapi.get('paths', {}))
        assert not missing, f'ROUTE MANCANTI: {sorted(missing)}'

        print('IMAGE RUNTIME PREFLIGHT: OK')
        print(json.dumps({
            'marker': version.get('electrical_code_marker'),
            'routes': sorted(required),
        }, ensure_ascii=False))
        "

  - id: "04-push-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA"

  - id: "05-deploy-candidate-zero-traffic"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -Eeuo pipefail

        IMAGE="europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA"
        BUILD8="$$(printf '%s' '$BUILD_ID' | cut -c1-8)"
        REV_SUFFIX="$SHORT_SHA-$${BUILD8}"
        REVISION="${_SERVICE}-$${REV_SUFFIX}"
        TAG="candidate-$SHORT_SHA-$${BUILD8}"

        cleanup_failed_candidate() {
          gcloud run services update-traffic "${_SERVICE}" \
            --region="${_REGION}" \
            --remove-tags="$${TAG}" \
            --quiet \
            >/dev/null 2>&1 || true
        }
        trap cleanup_failed_candidate ERR

        gcloud run services describe "${_SERVICE}" \
          --region="${_REGION}" \
          --format=json \
          > /workspace/service-before.json

        python3 - <<'PY' > /workspace/previous_revision.txt
        import json

        with open('/workspace/service-before.json', encoding='utf-8') as f:
            service = json.load(f)

        revisions = [
            row.get('revisionName')
            for row in service.get('status', {}).get('traffic', [])
            if int(row.get('percent') or 0) == 100
            and row.get('revisionName')
        ]

        if len(revisions) != 1:
            raise SystemExit(
                'ATTESO UN SOLO PRECEDENTE AL 100%, TROVATI: '
                + repr(revisions)
            )

        print(revisions[0])
        PY

        PREVIOUS_REVISION="$$(cat /workspace/previous_revision.txt)"

        echo "REVISIONE SANA PRECEDENTE: $${PREVIOUS_REVISION}"
        echo "NUOVA REVISIONE CANDIDATA: $${REVISION}"
        echo "TAG CANDIDATA: $${TAG}"

        gcloud run deploy "${_SERVICE}" \
          --image="$${IMAGE}" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --no-traffic \
          --tag="$${TAG}" \
          --revision-suffix="$${REV_SUFFIX}" \
          --timeout="600s" \
          --remove-env-vars="MM_ELECTRICAL_STRUCTURED_MODEL,MM_ELECTRICAL_STRUCTURED_PROMPT_VERSION,MM_ELECTRICAL_STRUCTURED_MIN_CONFIDENCE,MM_ELECTRICAL_STRUCTURED_MAX_WORDS_PER_PAGE" \
          --update-env-vars="COMMIT_SHA=$COMMIT_SHA,MM_ELECTRICAL_STRUCTURED_ENABLED=1,MM_ELECTRICAL_STRUCTURED_DETECTOR_MODEL=gpt-5.4,MM_ELECTRICAL_STRUCTURED_EXTRACTOR_MODEL=gpt-5.4,MM_ELECTRICAL_STRUCTURED_VERIFIER_MODEL=gpt-5.4,MM_ELECTRICAL_STRUCTURED_DETECTOR_PROMPT_VERSION=mm-electrical-region-detector-v2,MM_ELECTRICAL_STRUCTURED_EXTRACTOR_PROMPT_VERSION=mm-electrical-table-extractor-v2.2,MM_ELECTRICAL_STRUCTURED_VERIFIER_PROMPT_VERSION=mm-electrical-page-verifier-v2.2,MM_ELECTRICAL_STRUCTURED_MATERIALIZER_VERSION=mm-electrical-structured-materializer-v2.2,MM_ELECTRICAL_STRUCTURED_ROW_MIN_CONFIDENCE=0.80,MM_ELECTRICAL_STRUCTURED_PAGE_PASS_MIN_CONFIDENCE=0.90,MM_ELECTRICAL_STRUCTURED_TEXT_RECONSTRUCTION_MIN_CONFIDENCE=0.90,MM_ELECTRICAL_STRUCTURED_RENDER_DPI=220,MM_ELECTRICAL_STRUCTURED_MAX_COMPLETION_TOKENS=16000,MM_ELECTRICAL_STRUCTURED_FETCH_TIMEOUT_SECONDS=60,MM_ELECTRICAL_STRUCTURED_TIMEOUT_SECONDS=240,MM_ELECTRICAL_STRUCTURED_MAX_SOURCE_BYTES=100000000,MM_ELECTRICAL_STRUCTURED_INPUT_USD_PER_MILLION=0,MM_ELECTRICAL_STRUCTURED_OUTPUT_USD_PER_MILLION=0,MM_ELECTRICAL_SOURCE_SNAPSHOT_ENABLED=1,MM_ELECTRICAL_SOURCE_BUCKET=mm-ai-electrical-sources-443517556116,MM_ELECTRICAL_SOURCE_PREFIX=electrical-source-v1,MM_ELECTRICAL_SOURCE_TIMEOUT_SECONDS=90,MM_ELECTRICAL_SOURCE_MAX_BYTES=100000000" \
          --quiet

        gcloud run services describe "${_SERVICE}" \
          --region="${_REGION}" \
          --format=json \
          > /workspace/service-candidate.json

        export TAG REVISION
        python3 - <<'PY' > /workspace/candidate_url.txt
        import json
        import os

        tag = os.environ['TAG']
        revision = os.environ['REVISION']

        with open('/workspace/service-candidate.json', encoding='utf-8') as f:
            service = json.load(f)

        matches = [
            row
            for row in service.get('status', {}).get('traffic', [])
            if row.get('tag') == tag
            and row.get('revisionName') == revision
        ]

        if len(matches) != 1 or not matches[0].get('url'):
            raise SystemExit(
                'URL TAGGATA NON TROVATA PER '
                + tag
                + ' / '
                + revision
            )

        print(matches[0]['url'].rstrip('/'))
        PY

        CANDIDATE_URL="$$(cat /workspace/candidate_url.txt)"

        printf \
          'PREVIOUS_REVISION=%s\nREVISION=%s\nTAG=%s\nCANDIDATE_URL=%s\n' \
          "$${PREVIOUS_REVISION}" \
          "$${REVISION}" \
          "$${TAG}" \
          "$${CANDIDATE_URL}" \
          > /workspace/deploy.env

        echo "CANDIDATE URL: $${CANDIDATE_URL}"
        trap - ERR

  - id: "06-smoke-test-candidate"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -Eeuo pipefail
        source /workspace/deploy.env

        cleanup_failed_candidate() {
          gcloud run services update-traffic "${_SERVICE}" \
            --region="${_REGION}" \
            --remove-tags="$${TAG}" \
            --quiet \
            >/dev/null 2>&1 || true
        }
        trap cleanup_failed_candidate ERR

        CANDIDATE_URL="$${CANDIDATE_URL}" \
        EXPECTED_REVISION="$${REVISION}" \
        EXPECTED_COMMIT="$COMMIT_SHA" \
        EXPECTED_MARKER="${_EXPECTED_CODE_MARKER}" \
        EXPECTED_STRUCTURED_MODEL="${_EXPECTED_STRUCTURED_MODEL}" \
        EXPECTED_DETECTOR_PROMPT="${_EXPECTED_DETECTOR_PROMPT}" \
        EXPECTED_EXTRACTOR_PROMPT="${_EXPECTED_EXTRACTOR_PROMPT}" \
        EXPECTED_VERIFIER_PROMPT="${_EXPECTED_VERIFIER_PROMPT}" \
        EXPECTED_MATERIALIZER_VERSION="${_EXPECTED_MATERIALIZER_VERSION}" \
        python3 - <<'PY'
        import json
        import os
        import time
        import urllib.request

        base = os.environ['CANDIDATE_URL'].rstrip('/')

        def get_json(path):
            last_error = None
            for _ in range(30):
                try:
                    with urllib.request.urlopen(
                        base + path,
                        timeout=10,
                    ) as response:
                        return json.load(response)
                except Exception as exc:
                    last_error = exc
                    time.sleep(2)
            raise RuntimeError(
                f'SMOKE TEST FALLITO SU {path}: {last_error}'
            )

        ping = get_json('/ping')
        version = get_json('/version')
        openapi = get_json('/openapi.json')

        assert ping.get('ok') is True, ping
        assert version.get('ok') is True, version
        assert (
            version.get('revision')
            == os.environ['EXPECTED_REVISION']
        ), version
        assert (
            version.get('commit_sha')
            == os.environ['EXPECTED_COMMIT']
        ), version
        assert (
            version.get('electrical_code_marker')
            == os.environ['EXPECTED_MARKER']
        ), version
        assert version.get('electrical_source_snapshot_enabled') is True, version
        assert (
            version.get('electrical_source_snapshot_bucket')
            == 'mm-ai-electrical-sources-443517556116'
        ), version
        assert version.get('electrical_structured_enabled') is True, version
        assert (
            version.get('electrical_structured_pipeline_marker')
            == os.environ['EXPECTED_MARKER']
        ), version
        assert (
            version.get('electrical_structured_detector_model')
            == os.environ['EXPECTED_STRUCTURED_MODEL']
        ), version
        assert (
            version.get('electrical_structured_extractor_model')
            == os.environ['EXPECTED_STRUCTURED_MODEL']
        ), version
        assert (
            version.get('electrical_structured_verifier_model')
            == os.environ['EXPECTED_STRUCTURED_MODEL']
        ), version
        assert (
            version.get('electrical_structured_detector_prompt_version')
            == os.environ['EXPECTED_DETECTOR_PROMPT']
        ), version
        assert (
            version.get('electrical_structured_extractor_prompt_version')
            == os.environ['EXPECTED_EXTRACTOR_PROMPT']
        ), version
        assert (
            version.get('electrical_structured_verifier_prompt_version')
            == os.environ['EXPECTED_VERIFIER_PROMPT']
        ), version
        assert (
            version.get('electrical_structured_materializer_version')
            == os.environ['EXPECTED_MATERIALIZER_VERSION']
        ), version

        required = {
            '/v1/ai/electrical/normalize',
            '/v1/ai/electrical/extract-structured',
            '/v1/ai/electrical/source/snapshot',
        }
        missing = required - set(openapi.get('paths', {}))
        assert not missing, f'ROUTE MANCANTI: {sorted(missing)}'

        print('CANDIDATE SMOKE TEST: OK')
        print(json.dumps({
            'revision': version.get('revision'),
            'commit_sha': version.get('commit_sha'),
            'marker': version.get('electrical_code_marker'),
            'routes': sorted(required),
        }, ensure_ascii=False))
        PY

        trap - ERR

  - id: "07-promote-tested-revision"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        source /workspace/deploy.env

        rollback() {
          echo "POST-PROMOTION SMOKE FALLITO: ROLLBACK A $${PREVIOUS_REVISION}"

          gcloud run services update-traffic "${_SERVICE}" \
            --region="${_REGION}" \
            --to-revisions="$${PREVIOUS_REVISION}=100" \
            --quiet || true

          gcloud run services update-traffic "${_SERVICE}" \
            --region="${_REGION}" \
            --remove-tags="$${TAG}" \
            --quiet \
            >/dev/null 2>&1 || true
        }

        gcloud run services update-traffic "${_SERVICE}" \
          --region="${_REGION}" \
          --to-revisions="$${REVISION}=100" \
          --quiet

        gcloud run services describe "${_SERVICE}" \
          --region="${_REGION}" \
          --format=json \
          > /workspace/service-promoted.json

        SERVICE_URL="$$(python3 - <<'PY'
        import json

        with open('/workspace/service-promoted.json', encoding='utf-8') as f:
            service = json.load(f)

        print(
            str(service.get('status', {}).get('url') or '').rstrip('/')
        )
        PY
        )"

        if ! \
          SERVICE_URL="$${SERVICE_URL}" \
          EXPECTED_REVISION="$${REVISION}" \
          EXPECTED_COMMIT="$COMMIT_SHA" \
          EXPECTED_MARKER="${_EXPECTED_CODE_MARKER}" \
          EXPECTED_STRUCTURED_MODEL="${_EXPECTED_STRUCTURED_MODEL}" \
          EXPECTED_DETECTOR_PROMPT="${_EXPECTED_DETECTOR_PROMPT}" \
          EXPECTED_EXTRACTOR_PROMPT="${_EXPECTED_EXTRACTOR_PROMPT}" \
          EXPECTED_VERIFIER_PROMPT="${_EXPECTED_VERIFIER_PROMPT}" \
          EXPECTED_MATERIALIZER_VERSION="${_EXPECTED_MATERIALIZER_VERSION}" \
          python3 - <<'PY'
        import json
        import os
        import time
        import urllib.request

        with open('/workspace/service-promoted.json', encoding='utf-8') as f:
            service = json.load(f)

        expected_revision = os.environ['EXPECTED_REVISION']
        traffic = service.get('status', {}).get('traffic', [])
        matching = [
            row
            for row in traffic
            if row.get('revisionName') == expected_revision
            and int(row.get('percent') or 0) == 100
        ]
        assert len(matching) == 1, traffic

        base = os.environ['SERVICE_URL'].rstrip('/')

        def get_version():
            last_error = None
            for _ in range(30):
                try:
                    with urllib.request.urlopen(
                        base + '/version',
                        timeout=10,
                    ) as response:
                        return json.load(response)
                except Exception as exc:
                    last_error = exc
                    time.sleep(2)
            raise RuntimeError(
                f'POST-PROMOTION SMOKE FALLITO: {last_error}'
            )

        version = get_version()

        assert version.get('ok') is True, version
        assert version.get('revision') == expected_revision, version
        assert (
            version.get('commit_sha')
            == os.environ['EXPECTED_COMMIT']
        ), version
        assert (
            version.get('electrical_code_marker')
            == os.environ['EXPECTED_MARKER']
        ), version
        assert version.get('electrical_source_snapshot_enabled') is True, version
        assert (
            version.get('electrical_source_snapshot_bucket')
            == 'mm-ai-electrical-sources-443517556116'
        ), version
        assert version.get('electrical_structured_enabled') is True, version
        assert (
            version.get('electrical_structured_pipeline_marker')
            == os.environ['EXPECTED_MARKER']
        ), version
        assert (
            version.get('electrical_structured_detector_model')
            == os.environ['EXPECTED_STRUCTURED_MODEL']
        ), version
        assert (
            version.get('electrical_structured_extractor_model')
            == os.environ['EXPECTED_STRUCTURED_MODEL']
        ), version
        assert (
            version.get('electrical_structured_verifier_model')
            == os.environ['EXPECTED_STRUCTURED_MODEL']
        ), version
        assert (
            version.get('electrical_structured_detector_prompt_version')
            == os.environ['EXPECTED_DETECTOR_PROMPT']
        ), version
        assert (
            version.get('electrical_structured_extractor_prompt_version')
            == os.environ['EXPECTED_EXTRACTOR_PROMPT']
        ), version
        assert (
            version.get('electrical_structured_verifier_prompt_version')
            == os.environ['EXPECTED_VERIFIER_PROMPT']
        ), version
        assert (
            version.get('electrical_structured_materializer_version')
            == os.environ['EXPECTED_MATERIALIZER_VERSION']
        ), version

        print('PROMOZIONE VERIFICATA: OK')
        print(json.dumps({
            'revision': version.get('revision'),
            'commit_sha': version.get('commit_sha'),
            'marker': version.get('electrical_code_marker'),
        }, ensure_ascii=False))
        PY
        then
          rollback
          exit 1
        fi

        gcloud run services update-traffic "${_SERVICE}" \
          --region="${_REGION}" \
          --remove-tags="$${TAG}" \
          --quiet

        echo "DEPLOY FAIL-SAFE COMPLETATO: $${REVISION}"

images:
  - "europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA"

timeout: "3600s"