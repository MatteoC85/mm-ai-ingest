serviceAccount: projects/machinemind-ai-2a/serviceAccounts/443517556116-compute@developer.gserviceaccount.com
logsBucket: gs://mm-ai-cb-logs-443517556116

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t",
        "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mm-ai-ingest/mm-ai-ingest-prod:$COMMIT_SHA",
        "-f",
        "Dockerfile",
        "."
      ]

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mm-ai-ingest/mm-ai-ingest-prod:$COMMIT_SHA"
      ]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "mm-ai-ingest-prod",
        "--image",
        "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mm-ai-ingest/mm-ai-ingest-prod:$COMMIT_SHA",
        "--region",
        "europe-west1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--update-env-vars",
        "COMMIT_SHA=$COMMIT_SHA,MM_INGEST_LEDGER_AUTO_DDL=0",
        "--quiet"
      ]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "run",
        "services",
        "update-traffic",
        "mm-ai-ingest-prod",
        "--project",
        "$PROJECT_ID",
        "--region",
        "europe-west1",
        "--to-latest",
        "--quiet"
      ]

images:
  - "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mm-ai-ingest/mm-ai-ingest-prod:$COMMIT_SHA"
