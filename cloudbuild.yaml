serviceAccount: projects/machinemind-ai-2a/serviceAccounts/443517556116-compute@developer.gserviceaccount.com
logsBucket: gs://mm-ai-cb-logs-443517556116
timeout: 1200s

# Explicit live identity verified through the read-only control plane.
# Refresh all three pins together before any subsequent release.
# Rollback remains restricted to the historical REQUIRED revision.
substitutions:
  # Keep production on its prior revision until the live checks have passed.
  _P6_OPERATION: stage
  _P6_EXPECTED_CURRENT_SHA: bd4cce7ed527eea1669621fa04895eb2d7cff63a
  _P6_EXPECTED_CURRENT_REVISION: mm-ai-ingest-prod-b073da9dc6128467187f3483e4f940b76
  _P6_EXPECTED_CURRENT_DIGEST: sha256:16d21a6405c365ddc75e7c5cda609fe8b4752d3e785b58f01de7a276817e3acc

steps:
  # Reuse the exact SDK image that passed build 073da9dc on 2026-10-31.
  # Floating latest removed python3 from PATH and broke the release entrypoint.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:aa2b2728a6f3eaf1d6d37409133fde8220b28460282f6983e3055b1b2c792228
    id: phase6-readonly-preflight
    entrypoint: python3
    args: [tools/phase6_release.py]
    env:
      - 'MM_CB_PROJECT=$PROJECT_ID'
      - 'MM_CB_COMMIT=$COMMIT_SHA'
      - 'MM_CB_BUILD=$BUILD_ID'
      - 'MM_P6_OPERATION=preflight'
      - 'MM_P6_EXPECTED_CURRENT_SHA=${_P6_EXPECTED_CURRENT_SHA}'
      - 'MM_P6_EXPECTED_CURRENT_REVISION=${_P6_EXPECTED_CURRENT_REVISION}'
      - 'MM_P6_EXPECTED_CURRENT_DIGEST=${_P6_EXPECTED_CURRENT_DIGEST}'
  - name: gcr.io/cloud-builders/docker
    id: build-candidate
    args: [build, -t, 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mm-ai-ingest/mm-ai-ingest-prod:$COMMIT_SHA', -f, Dockerfile, '.']
  - name: gcr.io/cloud-builders/docker
    id: push-candidate
    args: [push, 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mm-ai-ingest/mm-ai-ingest-prod:$COMMIT_SHA']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:aa2b2728a6f3eaf1d6d37409133fde8220b28460282f6983e3055b1b2c792228
    id: phase6-required-release-guard
    entrypoint: python3
    args: [tools/phase6_release.py]
    env:
      - 'MM_CB_PROJECT=$PROJECT_ID'
      - 'MM_CB_COMMIT=$COMMIT_SHA'
      - 'MM_CB_BUILD=$BUILD_ID'
      - 'MM_P6_OPERATION=${_P6_OPERATION}'
      - 'MM_P6_EXPECTED_CURRENT_SHA=${_P6_EXPECTED_CURRENT_SHA}'
      - 'MM_P6_EXPECTED_CURRENT_REVISION=${_P6_EXPECTED_CURRENT_REVISION}'
      - 'MM_P6_EXPECTED_CURRENT_DIGEST=${_P6_EXPECTED_CURRENT_DIGEST}'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mm-ai-ingest/mm-ai-ingest-prod:$COMMIT_SHA'
