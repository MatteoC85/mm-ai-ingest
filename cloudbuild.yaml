steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: promote-o6-required-guard
    script: |
      #!/usr/bin/env python3
      """O6 one-time traffic promotion guard.

      Promotes only the already staged/tested REQUIRED revision to 100% traffic.
      It creates no revision, retrieves no secret values, performs no ASK/provider call,
      and does not modify Worker or Bubble configuration.
      """
      import json
      import re
      import subprocess
      import urllib.parse
      import urllib.request

      PROJECT = 'machinemind-ai-2a'
      REGION = 'europe-west1'
      SERVICE = 'mm-ai-ingest-prod'
      O6_TAG = 'o6-required'
      STAGED = 'mm-ai-ingest-prod-b6dbe527efc7e4379992c78d21b171ee0'
      STAGED_COMMIT = '27d0f2bd5b5ae698bc6dc0cb652f50a8832dcd2b'
      PREVIOUS_OFF = 'mm-ai-ingest-prod-be488dc361a144f0eadd3f156c631f02a'
      APP_SECRET = {'name': 'mm-app-authority-v1', 'key': '2'}
      BUBBLE_TOKEN = {'name': 'mm-bubble-authority-token-v1', 'key': '2'}
      PHASE = 'INITIALIZE'

      class GuardError(RuntimeError):
          pass

      def phase(value):
          global PHASE
          PHASE = value
          print('DEPLOY_GUARD_PHASE=' + value, flush=True)

      def require(ok, code):
          if not ok:
              raise GuardError(code)

      def gcloud(*args):
          try:
              result = subprocess.run(['gcloud', *args], text=True, capture_output=True, timeout=900)
          except (OSError, subprocess.TimeoutExpired):
              raise GuardError('GCLOUD_NOT_COMPLETED') from None
          if result.returncode != 0:
              family = '_'.join(args[:3]) if args[:2] == ('run', 'services') else '_'.join(args[:2])
              family = re.sub('[^A-Za-z0-9_]', '_', family).upper()
              raise GuardError('GCLOUD_COMMAND_FAILED_' + family)
          return result.stdout.strip()

      def read_resource(kind, name):
          raw = gcloud('run', kind, 'describe', name, '--project='+PROJECT,
                       '--region='+REGION, '--format=json')
          try:
              obj = json.loads(raw)
          except (ValueError, TypeError):
              raise GuardError('GCLOUD_JSON_INVALID') from None
          require(isinstance(obj, dict), 'GCLOUD_JSON_NOT_OBJECT')
          return obj

      def environment(spec):
          containers = spec.get('containers')
          require(isinstance(containers, list) and len(containers) == 1,
                  'EXPECTED_SINGLE_CONTAINER')
          env = {}
          for item in containers[0].get('env', []):
              require(isinstance(item, dict) and isinstance(item.get('name'), str),
                      'ENV_FORMAT_INVALID')
              require(item['name'] not in env, 'DUPLICATE_ENV_NAME')
              env[item['name']] = item
          return env

      def ready(obj, code):
          items = [x for x in obj.get('status', {}).get('conditions', [])
                   if isinstance(x, dict) and x.get('type') == 'Ready']
          require(len(items) == 1 and items[0].get('status') == 'True', code)

      def reconciled(obj, code):
          generation = obj.get('metadata', {}).get('generation')
          observed = obj.get('status', {}).get('observedGeneration')
          require(type(generation) is int and generation > 0 and
                  type(observed) is int and observed == generation, code)

      def traffic_rows(service, key='status'):
          rows = service.get(key, {}).get('traffic', [])
          require(isinstance(rows, list), 'TRAFFIC_ROWS_INVALID')
          return rows

      def effective_traffic(service):
          out = {}
          for item in traffic_rows(service):
              amount = item.get('percent', 0)
              require(type(amount) is int and 0 <= amount <= 100, 'TRAFFIC_PERCENT_INVALID')
              if amount:
                  rev = item.get('revisionName')
                  require(isinstance(rev, str) and rev.startswith(SERVICE+'-'),
                          'TRAFFIC_REVISION_INVALID')
                  out[rev] = out.get(rev, 0) + amount
          require(sum(out.values()) == 100, 'TRAFFIC_SUM_INVALID')
          return out

      def requested_traffic(service):
          rows = service.get('spec', {}).get('traffic', [])
          require(isinstance(rows, list), 'REQUESTED_TRAFFIC_INVALID')
          out = {}
          for item in rows:
              require(isinstance(item, dict), 'REQUESTED_TRAFFIC_INVALID')
              amount = item.get('percent', 0)
              require(type(amount) is int and 0 <= amount <= 100, 'REQUESTED_TRAFFIC_PERCENT_INVALID')
              if amount:
                  require(item.get('latestRevision', False) is False and
                          not item.get('configurationName'), 'REQUESTED_TRAFFIC_NOT_FIXED')
                  rev = item.get('revisionName')
                  require(isinstance(rev, str) and rev.startswith(SERVICE+'-'),
                          'REQUESTED_TRAFFIC_REVISION_INVALID')
                  out[rev] = out.get(rev, 0) + amount
          require(sum(out.values()) == 100, 'REQUESTED_TRAFFIC_SUM_INVALID')
          return out

      def secret_ref(env, name):
          item = env.get(name, {})
          require('value' not in item, 'SECRET_LITERAL_'+name)
          ref = item.get('valueFrom', {}).get('secretKeyRef')
          require(isinstance(ref, dict), 'SECRET_REF_MISSING_'+name)
          return {'name': ref.get('name'), 'key': ref.get('key')}

      def health(url, commit, revision):
          parsed = urllib.parse.urlsplit(url) if isinstance(url, str) else None
          require(parsed is not None and parsed.scheme == 'https' and
                  re.fullmatch(r'[a-z0-9-]+(?:\.[a-z0-9-]+)*\.run\.app', parsed.netloc or '') and
                  not parsed.path and not parsed.query and not parsed.fragment,
                  'SERVICE_URL_INVALID')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          for suffix in ('/ping', '/version'):
              try:
                  req = urllib.request.Request(url+suffix, headers={'Cache-Control':'no-cache'})
                  with opener.open(req, timeout=20) as response:
                      raw = response.read(262145)
                      require(response.status == 200 and len(raw) <= 262144,
                              'HEALTH_HTTP_INVALID')
                      body = json.loads(raw)
              except GuardError:
                  raise
              except Exception:
                  raise GuardError('HEALTH_REQUEST_FAILED') from None
              require(isinstance(body, dict) and body.get('ok') is True, 'HEALTH_NOT_OK')
              if suffix == '/version':
                  require(body.get('commit_sha') == commit and body.get('revision') == revision,
                          'HEALTH_IDENTITY_MISMATCH')

      def tagged_url(service):
          matches = [row for row in traffic_rows(service)
                     if isinstance(row, dict) and row.get('tag') == O6_TAG and
                     row.get('revisionName') == STAGED]
          require(len(matches) == 1, 'O6_TAG_BINDING_MISSING')
          url = matches[0].get('url')
          require(isinstance(url, str) and url.startswith('https://') and url.endswith('.run.app'),
                  'O6_TAG_URL_INVALID')
          return url

      def validate_staged_revision(revision):
          require(revision.get('metadata', {}).get('name') == STAGED, 'STAGED_NAME_MISMATCH')
          require(not revision.get('metadata', {}).get('deletionTimestamp'), 'STAGED_DELETING')
          reconciled(revision, 'STAGED_RECONCILING')
          ready(revision, 'STAGED_NOT_READY')
          env = environment(revision.get('spec', {}))
          require(env.get('COMMIT_SHA', {}).get('value') == STAGED_COMMIT,
                  'STAGED_COMMIT_MISMATCH')
          require(env.get('MM_ASK_REQUEST_AUTHORITY', {}).get('value') == 'required',
                  'STAGED_NOT_REQUIRED')
          require(env.get('MM_INGEST_LEDGER_AUTO_DDL', {}).get('value') == '0',
                  'AUTO_DDL_CHANGED')
          require(secret_ref(env, 'MM_APP_AUTHORITY_SECRET') == APP_SECRET,
                  'APP_AUTHORITY_SECRET_NOT_V2')
          require(secret_ref(env, 'MM_BUBBLE_AUTHORITY_TOKEN') == BUBBLE_TOKEN,
                  'BUBBLE_AUTHORITY_TOKEN_NOT_V2')

      def validate_previous_off(revision):
          require(revision.get('metadata', {}).get('name') == PREVIOUS_OFF,
                  'PREVIOUS_OFF_NAME_MISMATCH')
          require(not revision.get('metadata', {}).get('deletionTimestamp'),
                  'PREVIOUS_OFF_DELETING')
          reconciled(revision, 'PREVIOUS_OFF_RECONCILING')
          ready(revision, 'PREVIOUS_OFF_NOT_READY')
          env = environment(revision.get('spec', {}))
          mode = env.get('MM_ASK_REQUEST_AUTHORITY')
          mode_value = mode.get('value', 'off') if isinstance(mode, dict) else 'off'
          require(mode_value == 'off', 'PREVIOUS_BASELINE_NOT_OFF')
          require(secret_ref(env, 'MM_APP_AUTHORITY_SECRET') == APP_SECRET,
                  'PREVIOUS_APP_AUTHORITY_SECRET_NOT_V2')

      def revision_names():
          raw = gcloud('run', 'revisions', 'list', '--service='+SERVICE,
                       '--project='+PROJECT, '--region='+REGION, '--format=json')
          try:
              rows = json.loads(raw)
          except (ValueError, TypeError):
              raise GuardError('REVISION_LIST_JSON_INVALID') from None
          require(isinstance(rows, list), 'REVISION_LIST_NOT_ARRAY')
          names = {row.get('metadata', {}).get('name') for row in rows if isinstance(row, dict)}
          require(STAGED in names and PREVIOUS_OFF in names, 'EXPECTED_REVISIONS_NOT_LISTED')
          return names

      def execute():
          phase('VALIDATE_PRE_PROMOTION_STATE')
          service = read_resource('services', SERVICE)
          reconciled(service, 'SERVICE_RECONCILING')
          ready(service, 'SERVICE_NOT_READY')
          require(effective_traffic(service) == {PREVIOUS_OFF: 100},
                  'PRE_PROMOTION_EFFECTIVE_TRAFFIC_NOT_OFF_100')
          require(requested_traffic(service) == {PREVIOUS_OFF: 100},
                  'PRE_PROMOTION_REQUESTED_TRAFFIC_NOT_OFF_100')
          previous = read_resource('revisions', PREVIOUS_OFF)
          staged = read_resource('revisions', STAGED)
          validate_previous_off(previous)
          validate_staged_revision(staged)
          before_names = revision_names()
          tag_url = tagged_url(service)
          phase('RECHECK_TAGGED_REQUIRED_HEALTH')
          health(tag_url, STAGED_COMMIT, STAGED)

          phase('PROMOTE_REQUIRED_TO_100')
          gcloud('run', 'services', 'update-traffic', SERVICE,
                 '--project='+PROJECT, '--region='+REGION,
                 '--to-revisions='+STAGED+'=100', '--quiet')

          phase('VALIDATE_POST_PROMOTION_STATE')
          final = read_resource('services', SERVICE)
          reconciled(final, 'POST_PROMOTION_SERVICE_RECONCILING')
          ready(final, 'POST_PROMOTION_SERVICE_NOT_READY')
          require(effective_traffic(final) == {STAGED: 100},
                  'POST_PROMOTION_EFFECTIVE_TRAFFIC_NOT_REQUIRED_100')
          require(requested_traffic(final) == {STAGED: 100},
                  'POST_PROMOTION_REQUESTED_TRAFFIC_NOT_REQUIRED_100')
          require(revision_names() == before_names, 'PROMOTION_CREATED_OR_REMOVED_REVISION')
          validate_staged_revision(read_resource('revisions', STAGED))
          # Health on the base service URL proves ordinary production routing now lands
          # on the exact staged revision that was already positively authorized.
          health(final.get('status', {}).get('url'), STAGED_COMMIT, STAGED)
          return {
              'status': 'PASS_O6_PROMOTE_REQUIRED_100',
              'revision': STAGED,
              'previous_revision': PREVIOUS_OFF,
              'runtime_commit_sha': STAGED_COMMIT,
              'authority_mode': 'REQUIRED',
              'production_traffic_percent': 100,
              'new_revision_created': False,
              'ask_calls': 0,
              'ai_calls': 0,
              'automatic_rollback': False,
              'guard_version': 'b4o-o6-promote-existing-required-v1'
          }

      if __name__ == '__main__':
          try:
              print(json.dumps(execute(), sort_keys=True))
          except GuardError as exc:
              print(json.dumps({'status':'FAIL_O6_PROMOTE_REQUIRED_100',
                                'code':str(exc), 'phase':PHASE,
                                'automatic_rollback':False}, sort_keys=True))
              raise SystemExit(2)
          except Exception:
              print(json.dumps({'status':'FAIL_O6_PROMOTE_REQUIRED_100',
                                'code':'UNEXPECTED_ERROR', 'phase':PHASE,
                                'automatic_rollback':False}, sort_keys=True))
              raise SystemExit(2)
