AL_TERMINALS_OUTPUT_USD_PER_MILLION=0,MM_ELECTRICAL_SOURCE_SNAPSHOT_ENABLED=1,MM_ELECTRICAL_SOURCE_BUCKET=mm-ai-electrical-sources-443517556116,MM_ELECTRICAL_SOURCE_PREFIX=electrical-source-v1,MM_ELECTRICAL_SOURCE_TIMEOUT_SECONDS=90,MM_ELECTRICAL_SOURCE_MAX_BYTES=100000000" \
          --quiet

        gcloud run services describe "${_SERVICE}" \
          --region="${_REGION}" \
          --format=json \
          > /workspace/service-candidate.json

        export TAG REVISION
        python3 - <<'PY' > /workspace/candidate_url.txt
        import json
        import os

        tag = os.environ['TAG']
        revision = os.environ['REVISION']

        with open('/workspace/service-candidate.json', encoding='utf-8') as f:
            service = json.load(f)

        matches = [
            row
            for row in service.get('status', {}).get('traffic', [])
            if row.get('tag') == tag
            and row.get('revisionName') == revision
        ]

        if len(matches) != 1 or not matches[0].get('url'):
            raise SystemExit(
                'URL TAGGATA NON TROVATA PER '
                + tag
                + ' / '
                + revision
            )

        print(matches[0]['url'].rstrip('/'))
        PY

        CANDIDATE_URL="$$(cat /workspace/candidate_url.txt)"

        printf \
          'PREVIOUS_REVISION=%s\nREVISION=%s\nTAG=%s\nCANDIDATE_URL=%s\n' \
          "$${PREVIOUS_REVISION}" \
          "$${REVISION}" \
          "$${TAG}" \
          "$${CANDIDATE_URL}" \
          > /workspace/deploy.env

        echo "CANDIDATE URL: $${CANDIDATE_URL}"
        trap - ERR

  - id: "06-smoke-test-candidate"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -Eeuo pipefail
        source /workspace/deploy.env

        cleanup_failed_candidate() {
          gcloud run services update-traffic "${_SERVICE}" \
            --region="${_REGION}" \
            --remove-tags="$${TAG}" \
            --quiet \
            >/dev/null 2>&1 || true
        }
        trap cleanup_failed_candidate ERR

        CANDIDATE_URL="$${CANDIDATE_URL}" \
        EXPECTED_REVISION="$${REVISION}" \
        EXPECTED_COMMIT="$COMMIT_SHA" \
        EXPECTED_MARKER="${_EXPECTED_CODE_MARKER}" \
        EXPECTED_STRUCTURED_MODEL="${_EXPECTED_STRUCTURED_MODEL}" \
        EXPECTED_DETECTOR_PROMPT="${_EXPECTED_DETECTOR_PROMPT}" \
        EXPECTED_EXTRACTOR_PROMPT="${_EXPECTED_EXTRACTOR_PROMPT}" \
        EXPECTED_VERIFIER_PROMPT="${_EXPECTED_VERIFIER_PROMPT}" \
        EXPECTED_MATERIALIZER_VERSION="${_EXPECTED_MATERIALIZER_VERSION}" \
        EXPECTED_TERMINAL_MARKER="${_EXPECTED_TERMINAL_MARKER}" \
        EXPECTED_TERMINAL_MODEL="${_EXPECTED_TERMINAL_MODEL}" \
        EXPECTED_TERMINAL_DETECTOR_PROMPT="${_EXPECTED_TERMINAL_DETECTOR_PROMPT}" \
        EXPECTED_TERMINAL_EXTRACTOR_PROMPT="${_EXPECTED_TERMINAL_EXTRACTOR_PROMPT}" \
        EXPECTED_TERMINAL_VERIFIER_PROMPT="${_EXPECTED_TERMINAL_VERIFIER_PROMPT}" \
        EXPECTED_TERMINAL_MATERIALIZER="${_EXPECTED_TERMINAL_MATERIALIZER}" \
        python3 - <<'PY'
        import json
        import os
        import time
        import urllib.request

        base = os.environ['CANDIDATE_URL'].rstrip('/')

        def get_json(path):
            last_error = None
            for _ in range(30):
                try:
                    with urllib.request.urlopen(
                        base + path,
                        timeout=10,
                    ) as response:
                        return json.load(response)
                except Exception as exc:
                    last_error = exc
                    time.sleep(2)
            raise RuntimeError(
                f'SMOKE TEST FALLITO SU {path}: {last_error}'
            )

        ping = get_json('/ping')
        version = get_json('/version')
        openapi = get_json('/openapi.json')

        assert ping.get('ok') is True, ping
        assert version.get('ok') is True, version
        assert (
            version.get('revision')
            == os.environ['EXPECTED_REVISION']
        ), version
        assert (
            version.get('commit_sha')
            == os.environ['EXPECTED_COMMIT']
        ), version
        assert (
            version.get('electrical_code_marker')
            == os.environ['EXPECTED_MARKER']
        ), version
        assert version.get('electrical_source_snapshot_enabled') is True, version
        assert (
            version.get('electrical_source_snapshot_bucket')
            == 'mm-ai-electrical-sources-443517556116'
        ), version
        assert version.get('electrical_structured_enabled') is True, version
        assert (
            version.get('electrical_structured_pipeline_marker')
            == os.environ['EXPECTED_MARKER']
        ), version
        assert (
            version.get('electrical_structured_detector_model')
            == os.environ['EXPECTED_STRUCTURED_MODEL']
        ), version
        assert (
            version.get('electrical_structured_extractor_model')
            == os.environ['EXPECTED_STRUCTURED_MODEL']
        ), version
        assert (
            version.get('electrical_structured_verifier_model')
            == os.environ['EXPECTED_STRUCTURED_MODEL']
        ), version
        assert (
            version.get('electrical_structured_detector_prompt_version')
            == os.environ['EXPECTED_DETECTOR_PROMPT']
        ), version
        assert (
            version.get('electrical_structured_extractor_prompt_version')
            == os.environ['EXPECTED_EXTRACTOR_PROMPT']
        ), version
        assert (
            version.get('electrical_structured_verifier_prompt_version')
            == os.environ['EXPECTED_VERIFIER_PROMPT']
        ), version
        assert (
            version.get('electrical_structured_materializer_version')
            == os.environ['EXPECTED_MATERIALIZER_VERSION']
        ), version
        assert version.get('electrical_terminals_enabled') is True, version
        assert (
            version.get('electrical_terminals_pipeline_marker')
            == os.environ['EXPECTED_TERMINAL_MARKER']
        ), version
        assert (
            version.get('electrical_terminals_detector_model')
            == os.environ['EXPECTED_TERMINAL_MODEL']
        ), version
        assert (
            version.get('electrical_terminals_extractor_model')
            == os.environ['EXPECTED_TERMINAL_MODEL']
        ), version
        assert (
            version.get('electrical_terminals_verifier_model')
            == os.environ['EXPECTED_TERMINAL_MODEL']
        ), version
        assert (
            version.get('electrical_terminals_detector_prompt_version')
            == os.environ['EXPECTED_TERMINAL_DETECTOR_PROMPT']
        ), version
        assert (
            version.get('electrical_terminals_extractor_prompt_version')
            == os.environ['EXPECTED_TERMINAL_EXTRACTOR_PROMPT']
        ), version
        assert (
            version.get('electrical_terminals_verifier_prompt_version')
            == os.environ['EXPECTED_TERMINAL_VERIFIER_PROMPT']
        ), version
        assert (
            version.get('electrical_terminals_materializer_version')
            == os.environ['EXPECTED_TERMINAL_MATERIALIZER']
        ), version

        required = {
            '/v1/ai/electrical/normalize',
            '/v1/ai/electrical/extract-structured',
            '/v1/ai/electrical/extract-terminals',
            '/v1/ai/electrical/source/snapshot',
        }
        missing = required - set(openapi.get('paths', {}))
        assert not missing, f'ROUTE MANCANTI: {sorted(missing)}'

        print('CANDIDATE SMOKE TEST: OK')
        print(json.dumps({
            'revision': version.get('revision'),
            'commit_sha': version.get('commit_sha'),
            'marker': version.get('electrical_code_marker'),
            'routes': sorted(required),
        }, ensure_ascii=False))
        PY

        trap - ERR

  - id: "07-promote-tested-revision"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        source /workspace/deploy.env

        rollback() {
          echo "POST-PROMOTION SMOKE FALLITO: ROLLBACK A $${PREVIOUS_REVISION}"

          gcloud run services update-traffic "${_SERVICE}" \
            --region="${_REGION}" \
            --to-revisions="$${PREVIOUS_REVISION}=100" \
            --quiet || true

          gcloud run services update-traffic "${_SERVICE}" \
            --region="${_REGION}" \
            --remove-tags="$${TAG}" \
            --quiet \
            >/dev/null 2>&1 || true
        }

        gcloud run services update-traffic "${_SERVICE}" \
          --region="${_REGION}" \
          --to-revisions="$${REVISION}=100" \
          --quiet

        gcloud run services describe "${_SERVICE}" \
          --region="${_REGION}" \
          --format=json \
          > /workspace/service-promoted.json

        SERVICE_URL="$$(python3 - <<'PY'
        import json

        with open('/workspace/service-promoted.json', encoding='utf-8') as f:
            service = json.load(f)

        print(
            str(service.get('status', {}).get('url') or '').rstrip('/')
        )
        PY
        )"

        if ! \
          SERVICE_URL="$${SERVICE_URL}" \
          EXPECTED_REVISION="$${REVISION}" \
          EXPECTED_COMMIT="$COMMIT_SHA" \
          EXPECTED_MARKER="${_EXPECTED_CODE_MARKER}" \
          EXPECTED_STRUCTURED_MODEL="${_EXPECTED_STRUCTURED_MODEL}" \
          EXPECTED_DETECTOR_PROMPT="${_EXPECTED_DETECTOR_PROMPT}" \
          EXPECTED_EXTRACTOR_PROMPT="${_EXPECTED_EXTRACTOR_PROMPT}" \
          EXPECTED_VERIFIER_PROMPT="${_EXPECTED_VERIFIER_PROMPT}" \
          EXPECTED_MATERIALIZER_VERSION="${_EXPECTED_MATERIALIZER_VERSION}" \
          EXPECTED_TERMINAL_MARKER="${_EXPECTED_TERMINAL_MARKER}" \
          EXPECTED_TERMINAL_MODEL="${_EXPECTED_TERMINAL_MODEL}" \
          EXPECTED_TERMINAL_DETECTOR_PROMPT="${_EXPECTED_TERMINAL_DETECTOR_PROMPT}" \
          EXPECTED_TERMINAL_EXTRACTOR_PROMPT="${_EXPECTED_TERMINAL_EXTRACTOR_PROMPT}" \
          EXPECTED_TERMINAL_VERIFIER_PROMPT="${_EXPECTED_TERMINAL_VERIFIER_PROMPT}" \
          EXPECTED_TERMINAL_MATERIALIZER="${_EXPECTED_TERMINAL_MATERIALIZER}" \
          python3 - <<'PY'
        import json
        import os
        import time
        import urllib.request

        with open('/workspace/service-promoted.json', encoding='utf-8') as f:
            service = json.load(f)

        expected_revision = os.environ['EXPECTED_REVISION']
        traffic = service.get('status', {}).get('traffic', [])
        matching = [
            row
            for row in traffic
            if row.get('revisionName') == expected_revision
            and int(row.get('percent') or 0) == 100
        ]
        assert len(matching) == 1, traffic

        base = os.environ['SERVICE_URL'].rstrip('/')

        def get_version():
            last_error = None
            for _ in range(30):
                try:
                    with urllib.request.urlopen(
                        base + '/version',
                        timeout=10,
                    ) as response:
                        return json.load(response)
                except Exception as exc:
                    last_error = exc
                    time.sleep(2)
            raise RuntimeError(
                f'POST-PROMOTION SMOKE FALLITO: {last_error}'
            )

        version = get_version()

        assert version.get('ok') is True, version
        assert version.get('revision') == expected_revision, version
        assert (
            version.get('commit_sha')
            == os.environ['EXPECTED_COMMIT']
        ), version
        assert (
            version.get('electrical_code_marker')
            == os.environ['EXPECTED_MARKER']
        ), version
        assert version.get('electrical_source_snapshot_enabled') is True, version
        assert (
            version.get('electrical_source_snapshot_bucket')
            == 'mm-ai-electrical-sources-443517556116'
        ), version
        assert version.get('electrical_structured_enabled') is True, version
        assert (
            version.get('electrical_structured_pipeline_marker')
            == os.environ['EXPECTED_MARKER']
        ), version
        assert (
            version.get('electrical_structured_detector_model')
            == os.environ['EXPECTED_STRUCTURED_MODEL']
        ), version
        assert (
            version.get('electrical_structured_extractor_model')
            == os.environ['EXPECTED_STRUCTURED_MODEL']
        ), version
        assert (
            version.get('electrical_structured_verifier_model')
            == os.environ['EXPECTED_STRUCTURED_MODEL']
        ), version
        assert (
            version.get('electrical_structured_detector_prompt_version')
            == os.environ['EXPECTED_DETECTOR_PROMPT']
        ), version
        assert (
            version.get('electrical_structured_extractor_prompt_version')
            == os.environ['EXPECTED_EXTRACTOR_PROMPT']
        ), version
        assert (
            version.get('electrical_structured_verifier_prompt_version')
            == os.environ['EXPECTED_VERIFIER_PROMPT']
        ), version
        assert (
            version.get('electrical_structured_materializer_version')
            == os.environ['EXPECTED_MATERIALIZER_VERSION']
        ), version
        assert version.get('electrical_terminals_enabled') is True, version
        assert (
            version.get('electrical_terminals_pipeline_marker')
            == os.environ['EXPECTED_TERMINAL_MARKER']
        ), version
        assert (
            version.get('electrical_terminals_detector_model')
            == os.environ['EXPECTED_TERMINAL_MODEL']
        ), version
        assert (
            version.get('electrical_terminals_extractor_model')
            == os.environ['EXPECTED_TERMINAL_MODEL']
        ), version
        assert (
            version.get('electrical_terminals_verifier_model')
            == os.environ['EXPECTED_TERMINAL_MODEL']
        ), version
        assert (
            version.get('electrical_terminals_detector_prompt_version')
            == os.environ['EXPECTED_TERMINAL_DETECTOR_PROMPT']
        ), version
        assert (
            version.get('electrical_terminals_extractor_prompt_version')
            == os.environ['EXPECTED_TERMINAL_EXTRACTOR_PROMPT']
        ), version
        assert (
            version.get('electrical_terminals_verifier_prompt_version')
            == os.environ['EXPECTED_TERMINAL_VERIFIER_PROMPT']
        ), version
        assert (
            version.get('electrical_terminals_materializer_version')
            == os.environ['EXPECTED_TERMINAL_MATERIALIZER']
        ), version

        print('PROMOZIONE VERIFICATA: OK')
        print(json.dumps({
            'revision': version.get('revision'),
            'commit_sha': version.get('commit_sha'),
            'marker': version.get('electrical_code_marker'),
        }, ensure_ascii=False))
        PY
        then
          rollback
          exit 1
        fi

        gcloud run services update-traffic "${_SERVICE}" \
          --region="${_REGION}" \
          --remove-tags="$${TAG}" \
          --quiet

        echo "DEPLOY FAIL-SAFE COMPLETATO: $${REVISION}"

