steps:
- id: 01-source-preflight
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  args:
  - -c
  - |
    set -euo pipefail

    for file in \
      Dockerfile \
      main.py \
      electrical_semantic.py \
      electrical_structured.py \
      electrical_terminals.py \
      electrical_bom.py \
      electrical_graph.py \
      electrical_source_store.py \
      cloudbuild_runtime_preflight.py \
      mm_graph_batch_runner.py \
      requirements.txt
    do
      test -f "$${file}" || {
        echo "FILE OBBLIGATORIO MANCANTE: $${file}"
        exit 1
      }
    done

    python3 -m py_compile \
      main.py \
      electrical_semantic.py \
      electrical_structured.py \
      electrical_terminals.py \
      electrical_bom.py \
      electrical_graph.py \
      electrical_source_store.py \
      cloudbuild_runtime_preflight.py \
      mm_graph_batch_runner.py

    python3 mm_graph_batch_runner.py --self-test

    echo "SOURCE PREFLIGHT: OK"
- id: 02-build-image
  name: gcr.io/cloud-builders/docker
  args:
  - build
  - -t
  - europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
  - -f
  - Dockerfile
  - .
- id: 03-runtime-test-image
  name: gcr.io/cloud-builders/docker
  entrypoint: bash
  args:
  - -c
  - |-
    set -euo pipefail

    IMAGE="europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA"
    BUILD8="$$(printf '%s' '$BUILD_ID' | cut -c1-8)"
    NAME="mm-preflight-$SHORT_SHA-$${BUILD8}"

    cleanup() {
      docker rm -f "$${NAME}" >/dev/null 2>&1 || true
    }
    trap cleanup EXIT

    docker run -d \
      --name "$${NAME}" \
      -e PORT=8080 \
      -e MM_ELECTRICAL_SOURCE_SNAPSHOT_ENABLED=1 \
      -e MM_ELECTRICAL_SOURCE_BUCKET=mm-ai-electrical-sources-443517556116 \
      -e MM_ELECTRICAL_TERMINALS_ENABLED=1 \
      -e MM_ELECTRICAL_TERMINALS_DETECTOR_MODEL=${_EXPECTED_TERMINAL_MODEL} \
      -e MM_ELECTRICAL_TERMINALS_EXTRACTOR_MODEL=${_EXPECTED_TERMINAL_MODEL} \
      -e MM_ELECTRICAL_TERMINALS_VERIFIER_MODEL=${_EXPECTED_TERMINAL_MODEL} \
      -e MM_ELECTRICAL_TERMINALS_DETECTOR_PROMPT_VERSION=${_EXPECTED_TERMINAL_DETECTOR_PROMPT} \
      -e MM_ELECTRICAL_TERMINALS_EXTRACTOR_PROMPT_VERSION=${_EXPECTED_TERMINAL_EXTRACTOR_PROMPT} \
      -e MM_ELECTRICAL_TERMINALS_VERIFIER_PROMPT_VERSION=${_EXPECTED_TERMINAL_VERIFIER_PROMPT} \
      -e MM_ELECTRICAL_TERMINALS_MATERIALIZER_VERSION=${_EXPECTED_TERMINAL_MATERIALIZER} \
      -e MM_ELECTRICAL_BOM_ENABLED=1 \
      -e MM_ELECTRICAL_BOM_DETECTOR_MODEL=${_EXPECTED_BOM_MODEL} \
      -e MM_ELECTRICAL_BOM_EXTRACTOR_MODEL=${_EXPECTED_BOM_MODEL} \
      -e MM_ELECTRICAL_BOM_VERIFIER_MODEL=${_EXPECTED_BOM_MODEL} \
      -e MM_ELECTRICAL_BOM_DETECTOR_PROMPT_VERSION=${_EXPECTED_BOM_DETECTOR_PROMPT} \
      -e MM_ELECTRICAL_BOM_EXTRACTOR_PROMPT_VERSION=${_EXPECTED_BOM_EXTRACTOR_PROMPT} \
      -e MM_ELECTRICAL_BOM_VERIFIER_PROMPT_VERSION=${_EXPECTED_BOM_VERIFIER_PROMPT} \
      -e MM_ELECTRICAL_BOM_MATERIALIZER_VERSION=${_EXPECTED_BOM_MATERIALIZER} \
      -e MM_ELECTRICAL_GRAPH_ENABLED=1 \
      -e MM_ELECTRICAL_GRAPH_DETECTOR_MODEL=${_EXPECTED_GRAPH_MODEL} \
      -e MM_ELECTRICAL_GRAPH_EXTRACTOR_MODEL=${_EXPECTED_GRAPH_MODEL} \
      -e MM_ELECTRICAL_GRAPH_VERIFIER_MODEL=${_EXPECTED_GRAPH_MODEL} \
      -e MM_ELECTRICAL_GRAPH_DETECTOR_PROMPT_VERSION=${_EXPECTED_GRAPH_DETECTOR_PROMPT} \
      -e MM_ELECTRICAL_GRAPH_EXTRACTOR_PROMPT_VERSION=${_EXPECTED_GRAPH_EXTRACTOR_PROMPT} \
      -e MM_ELECTRICAL_GRAPH_VERIFIER_PROMPT_VERSION=${_EXPECTED_GRAPH_VERIFIER_PROMPT} \
      -e MM_ELECTRICAL_GRAPH_MATERIALIZER_VERSION=${_EXPECTED_GRAPH_MATERIALIZER} \
      -e EXPECTED_CODE_MARKER=${_EXPECTED_CODE_MARKER} \
      -e EXPECTED_STRUCTURED_MODEL=${_EXPECTED_STRUCTURED_MODEL} \
      -e EXPECTED_DETECTOR_PROMPT=${_EXPECTED_DETECTOR_PROMPT} \
      -e EXPECTED_EXTRACTOR_PROMPT=${_EXPECTED_EXTRACTOR_PROMPT} \
      -e EXPECTED_VERIFIER_PROMPT=${_EXPECTED_VERIFIER_PROMPT} \
      -e EXPECTED_MATERIALIZER_VERSION=${_EXPECTED_MATERIALIZER_VERSION} \
      -e EXPECTED_TERMINAL_MARKER=${_EXPECTED_TERMINAL_MARKER} \
      -e EXPECTED_TERMINAL_MODEL=${_EXPECTED_TERMINAL_MODEL} \
      -e EXPECTED_TERMINAL_DETECTOR_PROMPT=${_EXPECTED_TERMINAL_DETECTOR_PROMPT} \
      -e EXPECTED_TERMINAL_EXTRACTOR_PROMPT=${_EXPECTED_TERMINAL_EXTRACTOR_PROMPT} \
      -e EXPECTED_TERMINAL_VERIFIER_PROMPT=${_EXPECTED_TERMINAL_VERIFIER_PROMPT} \
      -e EXPECTED_TERMINAL_MATERIALIZER=${_EXPECTED_TERMINAL_MATERIALIZER} \
      -e EXPECTED_BOM_MARKER=${_EXPECTED_BOM_MARKER} \
      -e EXPECTED_BOM_MODEL=${_EXPECTED_BOM_MODEL} \
      -e EXPECTED_BOM_DETECTOR_PROMPT=${_EXPECTED_BOM_DETECTOR_PROMPT} \
      -e EXPECTED_BOM_EXTRACTOR_PROMPT=${_EXPECTED_BOM_EXTRACTOR_PROMPT} \
      -e EXPECTED_BOM_VERIFIER_PROMPT=${_EXPECTED_BOM_VERIFIER_PROMPT} \
      -e EXPECTED_BOM_MATERIALIZER=${_EXPECTED_BOM_MATERIALIZER} \
      -e EXPECTED_GRAPH_MARKER=${_EXPECTED_GRAPH_MARKER} \
      -e EXPECTED_GRAPH_MODEL=${_EXPECTED_GRAPH_MODEL} \
      -e EXPECTED_GRAPH_DETECTOR_PROMPT=${_EXPECTED_GRAPH_DETECTOR_PROMPT} \
      -e EXPECTED_GRAPH_EXTRACTOR_PROMPT=${_EXPECTED_GRAPH_EXTRACTOR_PROMPT} \
      -e EXPECTED_GRAPH_VERIFIER_PROMPT=${_EXPECTED_GRAPH_VERIFIER_PROMPT} \
      -e EXPECTED_GRAPH_MATERIALIZER=${_EXPECTED_GRAPH_MATERIALIZER} \
      "$${IMAGE}" >/dev/null

    READY=0
    for _ in $$(seq 1 45); do
      if docker exec "$${NAME}" python -c \
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=3).read()" \
        >/dev/null 2>&1
      then
        READY=1
        break
      fi
      sleep 1
    done

    if [ "$${READY}" != "1" ]; then
      echo "IL CONTAINER NON SI È AVVIATO SULLA PORTA 8080"
      docker logs "$${NAME}" || true
      exit 1
    fi

    docker cp \
      /workspace/cloudbuild_runtime_preflight.py \
      "$${NAME}:/tmp/cloudbuild_runtime_preflight.py"

    docker exec "$${NAME}" sh -c \
      'PYTHONPATH="$(pwd):${PYTHONPATH:-}" python /tmp/cloudbuild_runtime_preflight.py'
- id: 04-push-image
  name: gcr.io/cloud-builders/docker
  args:
  - push
  - europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
- id: 05-deploy-candidate-zero-traffic
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  args:
  - -c
  - |
    set -Eeuo pipefail

    IMAGE="europe-west1-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA"
    BUILD8="$$(printf '%s' '$BUILD_ID' | cut -c1-8)"
    REV_SUFFIX="$SHORT_SHA-$${BUILD8}"
    REVISION="${_SERVICE}-$${REV_SUFFIX}"
    TAG="candidate-$SHORT_SHA-$${BUILD8}"

    cleanup_failed_candidate() {
      gcloud run services update-traffic "${_SERVICE}" \
        --region="${_REGION}" \
        --remove-tags="$${TAG}" \
        --quiet \
        >/dev/null 2>&1 || true
    }
    trap cleanup_failed_candidate ERR

    gcloud run services describe "${_SERVICE}" \
      --region="${_REGION}" \
      --format=json \
      > /workspace/service-before.json

    python3 - <<'PY' > /workspace/previous_revision.txt
    import json

    with open('/workspace/service-before.json', encoding='utf-8') as f:
        service = json.load(f)

    revisions = [
        row.get('revisionName')
        for row in service.get('status', {}).get('traffic', [])
        if int(row.get('percent') or 0) == 100
        and row.get('revisionName')
    ]

    if len(revisions) != 1:
        raise SystemExit(
            'ATTESO UN SOLO PRECEDENTE AL 100%, TROVATI: '
            + repr(revisions)
        )

    print(revisions[0])
    PY

    PREVIOUS_REVISION="$$(cat /workspace/previous_revision.txt)"

    echo "REVISIONE SANA PRECEDENTE: $${PREVIOUS_REVISION}"
    echo "NUOVA REVISIONE CANDIDATA: $${REVISION}"
    echo "TAG CANDIDATA: $${TAG}"

    gcloud run deploy "${_SERVICE}" \
      --image="$${IMAGE}" \
      --region="${_REGION}" \
      --platform=managed \
      --allow-unauthenticated \
      --no-traffic \
      --tag="$${TAG}" \
      --revision-suffix="$${REV_SUFFIX}" \
      --timeout="600s" \
      --remove-env-vars="MM_ELECTRICAL_STRUCTURED_MODEL,MM_ELECTRICAL_STRUCTURED_PROMPT_VERSION,MM_ELECTRICAL_STRUCTURED_MIN_CONFIDENCE,MM_ELECTRICAL_STRUCTURED_MAX_WORDS_PER_PAGE" \
      --update-env-vars="COMMIT_SHA=$COMMIT_SHA,MM_ELECTRICAL_STRUCTURED_ENABLED=1,MM_ELECTRICAL_STRUCTURED_DETECTOR_MODEL=gpt-5.4,MM_ELECTRICAL_STRUCTURED_EXTRACTOR_MODEL=gpt-5.4,MM_ELECTRICAL_STRUCTURED_VERIFIER_MODEL=gpt-5.4,MM_ELECTRICAL_STRUCTURED_DETECTOR_PROMPT_VERSION=mm-electrical-region-detector-v2,MM_ELECTRICAL_STRUCTURED_EXTRACTOR_PROMPT_VERSION=mm-electrical-table-extractor-v2.2,MM_ELECTRICAL_STRUCTURED_VERIFIER_PROMPT_VERSION=mm-electrical-page-verifier-v2.7,MM_ELECTRICAL_STRUCTURED_MATERIALIZER_VERSION=mm-electrical-structured-materializer-v2.7,MM_ELECTRICAL_STRUCTURED_ROW_MIN_CONFIDENCE=0.80,MM_ELECTRICAL_STRUCTURED_PAGE_PASS_MIN_CONFIDENCE=0.90,MM_ELECTRICAL_STRUCTURED_TEXT_RECONSTRUCTION_MIN_CONFIDENCE=0.90,MM_ELECTRICAL_STRUCTURED_RENDER_DPI=220,MM_ELECTRICAL_STRUCTURED_MAX_COMPLETION_TOKENS=16000,MM_ELECTRICAL_STRUCTURED_FETCH_TIMEOUT_SECONDS=60,MM_ELECTRICAL_STRUCTURED_TIMEOUT_SECONDS=240,MM_ELECTRICAL_STRUCTURED_MAX_SOURCE_BYTES=100000000,MM_ELECTRICAL_STRUCTURED_INPUT_USD_PER_MILLION=0,MM_ELECTRICAL_STRUCTURED_OUTPUT_USD_PER_MILLION=0,MM_ELECTRICAL_TERMINALS_ENABLED=1,MM_ELECTRICAL_TERMINALS_DETECTOR_MODEL=gpt-5.4,MM_ELECTRICAL_TERMINALS_EXTRACTOR_MODEL=gpt-5.4,MM_ELECTRICAL_TERMINALS_VERIFIER_MODEL=gpt-5.4,MM_ELECTRICAL_TERMINALS_DETECTOR_PROMPT_VERSION=mm-electrical-terminal-detector-v1,MM_ELECTRICAL_TERMINALS_EXTRACTOR_PROMPT_VERSION=mm-electrical-terminal-strip-extractor-v1,MM_ELECTRICAL_TERMINALS_VERIFIER_PROMPT_VERSION=mm-electrical-terminal-page-verifier-v1.2,MM_ELECTRICAL_TERMINALS_MATERIALIZER_VERSION=mm-electrical-terminal-materializer-v1.2.1,MM_ELECTRICAL_TERMINALS_ROW_MIN_CONFIDENCE=0.82,MM_ELECTRICAL_TERMINALS_PAGE_PASS_MIN_CONFIDENCE=0.90,MM_ELECTRICAL_TERMINALS_RENDER_DPI=220,MM_ELECTRICAL_TERMINALS_MAX_COMPLETION_TOKENS=16000,MM_ELECTRICAL_TERMINALS_FETCH_TIMEOUT_SECONDS=60,MM_ELECTRICAL_TERMINALS_TIMEOUT_SECONDS=240,MM_ELECTRICAL_TERMINALS_MAX_SOURCE_BYTES=100000000,MM_ELECTRICAL_TERMINALS_INPUT_USD_PER_MILLION=0,MM_ELECTRICAL_TERMINALS_OUTPUT_USD_PER_MILLION=0,MM_ELECTRICAL_BOM_ENABLED=1,MM_ELECTRICAL_BOM_DETECTOR_MODEL=gpt-5.4,MM_ELECTRICAL_BOM_EXTRACTOR_MODEL=gpt-5.4,MM_ELECTRICAL_BOM_VERIFIER_MODEL=gpt-5.4,MM_ELECTRICAL_BOM_DETECTOR_PROMPT_VERSION=mm-electrical-bom-detector-v1,MM_ELECTRICAL_BOM_EXTRACTOR_PROMPT_VERSION=mm-electrical-bom-table-extractor-v1.1,MM_ELECTRICAL_BOM_VERIFIER_PROMPT_VERSION=mm-electrical-bom-page-verifier-v1.1,MM_ELECTRICAL_BOM_MATERIALIZER_VERSION=mm-electrical-bom-materializer-v2.1,MM_ELECTRICAL_BOM_ROW_MIN_CONFIDENCE=0.82,MM_ELECTRICAL_BOM_PAGE_PASS_MIN_CONFIDENCE=0.90,MM_ELECTRICAL_BOM_RENDER_DPI=220,MM_ELECTRICAL_BOM_MAX_COMPLETION_TOKENS=20000,MM_ELECTRICAL_BOM_FETCH_TIMEOUT_SECONDS=60,MM_ELECTRICAL_BOM_TIMEOUT_SECONDS=240,MM_ELECTRICAL_BOM_MAX_SOURCE_BYTES=100000000,MM_ELECTRICAL_BOM_INPUT_USD_PER_MILLION=0,MM_ELECTRICAL_BOM_OUTPUT_USD_PER_MILLION=0,MM_ELECTRICAL_GRAPH_ENABLED=1,MM_ELECTRICAL_GRAPH_DETECTOR_MODEL=gpt-5.4,MM_ELECTRICAL_GRAPH_EXTRACTOR_MODEL=gpt-5.4,MM_ELECTRICAL_GRAPH_VERIFIER_MODEL=gpt-5.4,MM_ELECTRICAL_GRAPH_DETECTOR_PROMPT_VERSION=mm-electrical-graph-detector-v1,MM_ELECTRICAL_GRAPH_EXTRACTOR_PROMPT_VERSION=mm-electrical-graph-page-extractor-v1,MM_ELECTRICAL_GRAPH_VERIFIER_PROMPT_VERSION=mm-electrical-graph-page-verifier-v3,MM_ELECTRICAL_GRAPH_MATERIALIZER_VERSION=mm-electrical-graph-materializer-v3.1,MM_ELECTRICAL_GRAPH_ENTITY_MIN_CONFIDENCE=0.84,MM_ELECTRICAL_GRAPH_EDGE_MIN_CONFIDENCE=0.86,MM_ELECTRICAL_GRAPH_PAGE_PASS_MIN_CONFIDENCE=0.90,MM_ELECTRICAL_GRAPH_RENDER_DPI=240,MM_ELECTRICAL_GRAPH_MAX_COMPLETION_TOKENS=40000,MM_ELECTRICAL_GRAPH_FETCH_TIMEOUT_SECONDS=60,MM_ELECTRICAL_GRAPH_TIMEOUT_SECONDS=600,MM_ELECTRICAL_GRAPH_MAX_SOURCE_BYTES=100000000,MM_ELECTRICAL_GRAPH_INPUT_USD_PER_MILLION=0,MM_ELECTRICAL_GRAPH_OUTPUT_USD_PER_MILLION=0,MM_ELECTRICAL_SOURCE_SNAPSHOT_ENABLED=1,MM_ELECTRICAL_SOURCE_BUCKET=mm-ai-electrical-sources-443517556116,MM_ELECTRICAL_SOURCE_PREFIX=electrical-source-v1,MM_ELECTRICAL_SOURCE_TIMEOUT_SECONDS=90,MM_ELECTRICAL_SOURCE_MAX_BYTES=100000000" \
      --quiet

    gcloud run services describe "${_SERVICE}" \
      --region="${_REGION}" \
      --format=json \
      > /workspace/service-candidate.json

    export TAG REVISION
    python3 - <<'PY' > /workspace/candidate_url.txt
    import json
    import os

    tag = os.environ['TAG']
    revision = os.environ['REVISION']

    with open('/workspace/service-candidate.json', encoding='utf-8') as f:
        service = json.load(f)

    matches = [
        row
        for row in service.get('status', {}).get('traffic', [])
        if row.get('tag') == tag
        and row.get('revisionName') == revision
    ]

    if len(matches) != 1 or not matches[0].get('url'):
        raise SystemExit(
            'URL TAGGATA NON TROVATA PER '
            + tag
            + ' / '
            + revision
        )

    print(matches[0]['url'].rstrip('/'))
    PY

    CANDIDATE_URL="$$(cat /workspace/candidate_url.txt)"

    printf \
      'PREVIOUS_REVISION=%s\nREVISION=%s\nTAG=%s\nCANDIDATE_URL=%s\n' \
      "$${PREVIOUS_REVISION}" \
      "$${REVISION}" \
      "$${TAG}" \
      "$${CANDIDATE_URL}" \
      > /workspace/deploy.env

    echo "CANDIDATE URL: $${CANDIDATE_URL}"
    trap - ERR
- id: 06-smoke-test-candidate
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  args:
  - -c
  - |
    set -Eeuo pipefail
    source /workspace/deploy.env

    cleanup_failed_candidate() {
      gcloud run services update-traffic "${_SERVICE}" \
        --region="${_REGION}" \
        --remove-tags="$${TAG}" \
        --quiet \
        >/dev/null 2>&1 || true
    }
    trap cleanup_failed_candidate ERR

    CANDIDATE_URL="$${CANDIDATE_URL}" \
    EXPECTED_REVISION="$${REVISION}" \
    EXPECTED_COMMIT="$COMMIT_SHA" \
    EXPECTED_MARKER="${_EXPECTED_CODE_MARKER}" \
    EXPECTED_STRUCTURED_MODEL="${_EXPECTED_STRUCTURED_MODEL}" \
    EXPECTED_DETECTOR_PROMPT="${_EXPECTED_DETECTOR_PROMPT}" \
    EXPECTED_EXTRACTOR_PROMPT="${_EXPECTED_EXTRACTOR_PROMPT}" \
    EXPECTED_VERIFIER_PROMPT="${_EXPECTED_VERIFIER_PROMPT}" \
    EXPECTED_MATERIALIZER_VERSION="${_EXPECTED_MATERIALIZER_VERSION}" \
    EXPECTED_TERMINAL_MARKER="${_EXPECTED_TERMINAL_MARKER}" \
    EXPECTED_TERMINAL_MODEL="${_EXPECTED_TERMINAL_MODEL}" \
    EXPECTED_TERMINAL_DETECTOR_PROMPT="${_EXPECTED_TERMINAL_DETECTOR_PROMPT}" \
    EXPECTED_TERMINAL_EXTRACTOR_PROMPT="${_EXPECTED_TERMINAL_EXTRACTOR_PROMPT}" \
    EXPECTED_TERMINAL_VERIFIER_PROMPT="${_EXPECTED_TERMINAL_VERIFIER_PROMPT}" \
    EXPECTED_TERMINAL_MATERIALIZER="${_EXPECTED_TERMINAL_MATERIALIZER}" \
    EXPECTED_BOM_MARKER="${_EXPECTED_BOM_MARKER}" \
    EXPECTED_BOM_MODEL="${_EXPECTED_BOM_MODEL}" \
    EXPECTED_BOM_DETECTOR_PROMPT="${_EXPECTED_BOM_DETECTOR_PROMPT}" \
    EXPECTED_BOM_EXTRACTOR_PROMPT="${_EXPECTED_BOM_EXTRACTOR_PROMPT}" \
    EXPECTED_BOM_VERIFIER_PROMPT="${_EXPECTED_BOM_VERIFIER_PROMPT}" \
    EXPECTED_BOM_MATERIALIZER="${_EXPECTED_BOM_MATERIALIZER}" \
    EXPECTED_GRAPH_MARKER="${_EXPECTED_GRAPH_MARKER}" \
    EXPECTED_GRAPH_MODEL="${_EXPECTED_GRAPH_MODEL}" \
    EXPECTED_GRAPH_DETECTOR_PROMPT="${_EXPECTED_GRAPH_DETECTOR_PROMPT}" \
    EXPECTED_GRAPH_EXTRACTOR_PROMPT="${_EXPECTED_GRAPH_EXTRACTOR_PROMPT}" \
    EXPECTED_GRAPH_VERIFIER_PROMPT="${_EXPECTED_GRAPH_VERIFIER_PROMPT}" \
    EXPECTED_GRAPH_MATERIALIZER="${_EXPECTED_GRAPH_MATERIALIZER}" \
    python3 - <<'PY'
    import json
    import os
    import time
    import urllib.request

    base = os.environ['CANDIDATE_URL'].rstrip('/')

    def get_json(path):
        last_error = None
        for _ in range(30):
            try:
                with urllib.request.urlopen(
                    base + path,
                    timeout=10,
                ) as response:
                    return json.load(response)
            except Exception as exc:
                last_error = exc
                time.sleep(2)
        raise RuntimeError(
            f'SMOKE TEST FALLITO SU {path}: {last_error}'
        )

    ping = get_json('/ping')
    version = get_json('/version')
    openapi = get_json('/openapi.json')

    assert ping.get('ok') is True, ping
    assert version.get('ok') is True, version
    assert (
        version.get('revision')
        == os.environ['EXPECTED_REVISION']
    ), version
    assert (
        version.get('commit_sha')
        == os.environ['EXPECTED_COMMIT']
    ), version
    assert (
        version.get('electrical_code_marker')
        == os.environ['EXPECTED_MARKER']
    ), version
    assert version.get('electrical_source_snapshot_enabled') is True, version
    assert (
        version.get('electrical_source_snapshot_bucket')
        == 'mm-ai-electrical-sources-443517556116'
    ), version
    assert version.get('electrical_structured_enabled') is True, version
    assert (
        version.get('electrical_structured_pipeline_marker')
        == os.environ['EXPECTED_MARKER']
    ), version
